        <button type="button" class="stop-btn" @click="stop()">■ Stop</button>
      </div>
      <div x-ref="bottom"></div>
    </div>

<!-- share overlay: the rendered boarding pass + copy/save/share actions -->
    <div class="share-overlay" style="display: none" x-show="share.open"
         @click.self="closeShare()" @keydown.escape.window="closeShare()">
      <div class="share-panel">
        <div class="share-head">
          <div class="share-title">Send this flight</div>
          <button class="share-close" @click="closeShare()" aria-label="Close">✕</button>
        </div>
        <img class="share-preview" :src="share.imgUrl" x-show="share.imgUrl" alt="Flight card" />
        <div class="share-actions">
          <button class="card-action" x-show="share.canNative" @click="shareNative()">Share…</button>
          <button class="card-action" @click="shareCopyImage()">Copy image</button>
          <button class="card-action" @click="shareCopyText()">Copy text</button>
          <button class="card-action" @click="shareDownload()">Save image</button>
          <span class="share-toast" x-show="share.toast" x-text="share.toast"></span>
        </div>
      </div>
    </div>

    <div class="input-area" :class="barRaised ? 'raised' : ''">
      <div class="input-inner">
        <form @submit.prevent="search()">
          <div class="input-row">
            <textarea
              x-ref="box"
              rows="1"
              class="text-input"
              x-model="input"
              @input="autosize()"
              @keydown.enter="onEnter($event)"
              placeholder="Tell me where you'd like to go…"
            ></textarea>
            <button type="submit" class="submit-btn" :disabled="!input.trim()">Send</button>
          </div>
        </form>
      </div>
    </div>

    <button class="new-below" x-show="newBelow !== false" @click="jumpToNew()">↓ Results ready</button>

    <div class="footer">
      <div class="flourish">✦ ✦ ✦</div>
      <a href="https://evanburkeen.com">Evan Burkeen</a>
    </div>

    <nav class="ladder" :class="ladderOpen ? 'overlay' : ''" x-show="ladder().length > 1" aria-label="Search results index">
      <div class="ladder-title">Searches</div>
      <template x-for="(item, i) in ladder()" :key="item.anchor">
        <button class="ladder-item" @click="jumpTo(item.anchor); ladderOpen = false" :title="item.label">
          <span class="n" x-text="i + 1"></span><span x-text="item.label"></span>
        </button>
      </template>
    </nav>
    <button class="ladder-fab" x-show="ladder().length > 1" @click="ladderOpen = !ladderOpen"
            x-text="ladderOpen ? '✕ Close' : '☰ Searches'"></button>
  </div>

  <script>
    function flightApp() {
      return {
        messages: [],
        input: '',
        isLoading: false,
        hasSearched: false,
        history: [],
        sectionSeq: 0,
        ladderOpen: false,
        viewMode: localStorage.getItem('flightViewMode') || 'detailed',
        theme: localStorage.getItem('flightTheme') === 'dark' ? 'dark' : 'light',
        newBelow: false,
        barRaised: false,
        loadingText: 'Thinking…',
        share: { open: false, imgUrl: null, blob: null, text: '', toast: '', canNative: false },
        loadingTimer: null,
        controller: null,
        reqId: 0,

        init() {
          // one shared coastline definition; every mini-map references it via <use>
          if (!document.getElementById('worldpath')) {
            const holder = document.createElement('div');
            holder.innerHTML = `<svg style="position:absolute;width:0;height:0" aria-hidden="true"><defs><path id="worldpath" d="${WORLD_PATH}"/><path id="lakespath" d="${LAKES_PATH}"/></defs></svg>`;
            document.body.appendChild(holder.firstChild);
          }
          // the compose bar only earns its divider when content actually runs
          // underneath it; ResizeObserver catches replies growing the page
          this.syncBar();
          window.addEventListener('resize', () => this.syncBar());
          try {
            new ResizeObserver(() => this.syncBar()).observe(document.querySelector('.container'));
          } catch (e) { /* older browsers: scroll + resize still cover it */ }

          // scrolling the new reply into view dismisses the "results ready" nudge
          window.addEventListener('scroll', () => {
            this.syncBar();
            if (this.newBelow === false) return;
            const el = document.getElementById('msg-' + this.newBelow);
            if (!el || el.getBoundingClientRect().top < window.innerHeight - 120) this.newBelow = false;
          }, { passive: true });
        },


        syncBar() {
          // Scrollable means real content can pass under the bar, which is the
          // only time a divider is telling the truth. Measuring "content below
          // the bar's top edge" instead would count the container's own bottom
          // padding and raise the divider even on the empty landing screen.
          this.barRaised = document.documentElement.scrollHeight > window.innerHeight + 2;
        },

        maybeNudge() {
          // no auto-scroll on completion by design; instead, offer a jump
          // when the reply landed below the current viewport
          this.$nextTick(() => {
            const i = this.messages.length - 1;
            const el = document.getElementById('msg-' + i);
            if (el && el.getBoundingClientRect().top > window.innerHeight - 120) this.newBelow = i;
          });
        },

        jumpToNew() {
          const el = document.getElementById('msg-' + this.newBelow);
          this.newBelow = false;
          el?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        },

        scrollToBottom() {
          this.$nextTick(() => { this.$refs.bottom?.scrollIntoView({ behavior: 'smooth' }); });
        },

        setView(mode) {
          this.viewMode = mode;
          localStorage.setItem('flightViewMode', mode);
          // global switch resets any per-section overrides
          this.messages.forEach(m => (m.sections || []).forEach(s => { delete s._view; }));
        },

        sectionView(sec) {
          return sec._view || this.viewMode;
        },

        cycleTheme() {
          this.theme = this.theme === 'light' ? 'dark' : 'light';
          localStorage.setItem('flightTheme', this.theme);
          window.__applyTheme();
        },
        themeIcon() {
          return this.theme === 'dark' ? '☾' : '☀';
        },
        themeTitle() {
          return this.theme === 'dark' ? 'Theme: dark — click for light' : 'Theme: light — click for dark';
        },

        // --- instant client-side browse: filter/sort/expand over already-fetched results ---
        _legsOf(sec, x) {
          if (sec.type === 'itineraries') return x.outbound.legs;
          if (sec.type === 'multicity') return x.parts[0].legs;
          return x.legs;
        },
        _priceOf(sec, x) { return sec.type === 'flights' ? x.price : x.total_price; },
        _durOf(sec, x) {
          if (sec.type === 'itineraries') return (x.outbound.duration || 0) + (x.return.duration || 0);
          if (sec.type === 'multicity') return x.parts.reduce((s, p) => s + (p.duration || 0), 0);
          return x.duration;
        },
        _directOf(sec, x) {
          if (sec.type === 'itineraries') return x.outbound.stops === 0 && x.return.stops === 0;
          if (sec.type === 'multicity') return x.parts.every(p => p.stops === 0);
          return x.stops === 0;
        },

        _stopsOf(sec, x) {
          if (sec.type === 'itineraries') return Math.max(x.outbound.stops, x.return.stops);
          if (sec.type === 'multicity') return Math.max(...x.parts.map(p => p.stops));
          return x.stops;
        },
        _partsOf(sec, x) {
          return sec.type === 'itineraries' ? [x.outbound, x.return]
               : sec.type === 'multicity' ? x.parts : [x];
        },
        _airlinesOf(sec, x) {
          return this._partsOf(sec, x).flatMap(p => (p.legs || []).map(l => l.airline_code));
        },

        list(sec) {
          let rs = sec.results || [];
          const f = sec._filters || {};
          if (f.dep) {
            const inB = (h, b) => b === 'early' ? h < 8 : b === 'morning' ? (h >= 8 && h < 12) : b === 'afternoon' ? (h >= 12 && h < 18) : h >= 18;
            rs = rs.filter(x => {
              const t = this._legsOf(sec, x)[0].departure;
              return inB(t ? parseInt(t.slice(11, 13), 10) : 0, f.dep);
            });
          }
          if (f.maxDur) rs = rs.filter(x => (this._durOf(sec, x) ?? 1e9) <= f.maxDur * 60);
          if (f.airline) rs = rs.filter(x => this._airlinesOf(sec, x).includes(f.airline));
          if (f.alliance) rs = rs.filter(x => this._partsOf(sec, x).some(p => p.alliance === f.alliance));
          if (f.stops !== '' && f.stops != null) rs = rs.filter(x => this._stopsOf(sec, x) <= +f.stops);
          if (f.sort === 'price') rs = [...rs].sort((a, b) => (this._priceOf(sec, a) ?? 1e9) - (this._priceOf(sec, b) ?? 1e9));
          else if (f.sort === 'duration') rs = [...rs].sort((a, b) => (this._durOf(sec, a) ?? 1e9) - (this._durOf(sec, b) ?? 1e9));
          else if (f.sort === 'departure') rs = [...rs].sort((a, b) => (this._legsOf(sec, a)[0].departure || '').localeCompare(this._legsOf(sec, b)[0].departure || ''));
          return rs;
        },

        durationOptions(sec) {
          const durs = (sec.results || []).map(x => this._durOf(sec, x)).filter(Boolean);
          if (!durs.length) return [];
          const minH = Math.min(...durs) / 60, maxH = Math.max(...durs) / 60;
          return [4, 6, 8, 10, 12, 15, 18, 24, 30, 36, 48].filter(h => h > minH && h < maxH).slice(0, 4);
        },

        airlineOptions(sec) {
          const seen = new Map();
          for (const x of sec.results || []) {
            for (const p of this._partsOf(sec, x)) {
              if (p.airline_code && !seen.has(p.airline_code)) seen.set(p.airline_code, p.airline);
            }
          }
          return [...seen].map(([code, name]) => ({ code, name })).sort((a, b) => (a.name || '').localeCompare(b.name || ''));
        },

        allianceOptions(sec) {
          const seen = new Set();
          for (const x of sec.results || []) {
            for (const p of this._partsOf(sec, x)) if (p.alliance) seen.add(p.alliance);
          }
          return [...seen].sort();
        },

        visible(sec, previewN) {
          const rs = this.list(sec);
          return sec._expanded ? rs : rs.slice(0, previewN);
        },

        visibleDates(sec) {
          const all = sec.dates || [];
          if (sec._expanded || all.length <= 12) return all;
          // default view: only dates worth considering (within 15% of cheapest)
          const min = Math.min(...all.map(d => d.price));
          let best = all.filter(d => d.price <= min * 1.15);
          if (best.length < 6) best = [...all].sort((a, b) => a.price - b.price).slice(0, 6);
          if (best.length > 14) best = [...best].sort((a, b) => a.price - b.price).slice(0, 14);
          const keep = new Set(best.map(d => d.date + '|' + (d.return_date || '')));
          return all.filter(d => keep.has(d.date + '|' + (d.return_date || '')));
        },

        // the calendar heatmap behind "Show the full calendar": months of the
        // searched window, each day tinted by how its fare compares to the
        // window's cheapest (tiers are ratios, so one absurd outlier cannot
        // wash out the scale)
        calendarMonths(sec) {
          const byDate = {};   // departure date -> cheapest pairing that day
          for (const d of (sec.dates || [])) {
            const cur = byDate[d.date];
            if (!cur || d.price < cur.price) byDate[d.date] = d;
          }
          const entries = Object.values(byDate);
          if (!entries.length) return [];
          const min = Math.min(...entries.map(d => d.price));
          const heat = p => p <= min * 1.05 ? 0 : p <= min * 1.15 ? 1 : p <= min * 1.35 ? 2 : p <= min * 1.65 ? 3 : 4;
          const months = [];
          let cur = null;
          for (const key of Object.keys(byDate).sort()) {
            const [y, m, day] = key.split('-').map(Number);
            if (!cur || cur.y !== y || cur.m !== m) {
              cur = {
                key: y + '-' + m, y, m, days: {},
                label: new Date(y, m - 1, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' }),
              };
              months.push(cur);
            }
            cur.days[day] = { ...byDate[key], heat: heat(byDate[key].price) };
          }
          for (const mo of months) {
            const firstDow = new Date(mo.y, mo.m - 1, 1).getDay();
            const nDays = new Date(mo.y, mo.m, 0).getDate();
            mo.cells = [];
            for (let i = 0; i < firstDow; i++) mo.cells.push({ day: null, d: null });
            for (let day = 1; day <= nDays; day++) mo.cells.push({ day, d: mo.days[day] || null });
          }
          return months;
        },

        calCellTitle(d) {
          let t = this.formatDate(d.date);
          if (d.return_date) t += ' → ' + this.formatDate(d.return_date);
          t += ' · ' + this.formatPrice(d.price, d.currency);
          if (d.return_date) t += ' round trip';
          return t;
        },

        calNote(sec) {
          const withRet = (sec.dates || []).filter(d => d.return_date);
          if (!withRet.length) return 'Tap a date to see the flights.';
          const nights = new Set(withRet.map(d =>
            Math.round((new Date(d.return_date + 'T12:00:00') - new Date(d.date + 'T12:00:00')) / 86400000)));
          if (nights.size !== 1) return 'Round-trip totals. Hover a date for its return day; tap to see the flights.';
          const n = [...nights][0];
          return n === 0
            ? 'Round-trip totals for same-day returns. Tap a date to see the flights.'
            : 'Round-trip totals for ' + n + '-night trips. Tap a date to see the flights.';
        },

        calPrice(d) {
          if (d.price >= 10000) return '$' + Math.round(d.price / 1000) + 'k';
          return this.formatPrice(d.price, d.currency);
        },

        canExpand(sec) {
          if (sec.type === 'dates') return (sec.dates || []).length > 12;
          if (sec.type === 'itineraries') {
            // the board earns its place whenever there is anything to compose
            return (sec.results || []).length > 1 || (sec.more_outbounds || []).length > 0
              || (((sec.results || [])[0] || {}).return_options || []).length > 1;
          }
          return (sec.results || []).length > (this.sectionView(sec) === 'compact' ? 8 : 5);
        },

        expandLabel(sec) {
          if (sec.type === 'dates') {
            return sec._expanded ? 'Show best-value dates only'
              : 'Show the full calendar · all ' + (sec.dates || []).length + ' dates';
          }
          if (sec.type === 'itineraries') {
            return sec._expanded ? 'Show top picks only'
              : 'Mix & match all ' + this.rtAll(sec).length + ' outbounds · filter & sort';
          }
          return sec._expanded ? 'Show top picks only'
            : 'Show all ' + this.list(sec).length + ' options · filter & sort';
        },

        setF(sec, key, value) {
          if (!sec._filters) sec._filters = {};
          sec._filters[key] = value;
        },


        multiCityPoints(it) {
          const pts = [];
          (it.parts || []).forEach(p => (p.route_points || []).forEach(pt => {
            if (!pts.length || pts[pts.length - 1].code !== pt.code) pts.push(pt);
          }));
          return pts;
        },

        autosize() {
          const el = this.$refs.box;
          if (!el) return;
          // An empty box must never keep a grown height. Measuring during the
          // same tick that tears down the landing page could read a stale
          // scrollHeight and pin the field open at its 10rem maximum, which
          // the sticky bar then kept on screen permanently.
          if (!el.value) { el.style.height = ''; return; }
          el.style.height = 'auto';
          el.style.height = Math.min(el.scrollHeight, 160) + 'px';
        },

        onEnter(e) {
          if (e.shiftKey) return; // allow newline
          e.preventDefault();
          this.search();
        },

        startLoadingCycle() {
          // phrases must be honest for ANY query (not every turn searches fares)
          const openers = ['One moment…', 'Right away…', 'Let me see…', 'On it…'];
          const working = [
            'Looking into that for you…', 'Consulting my sources…',
            'Checking the details…', 'Gathering what you need…',
            'A little patience, well spent…', 'Cross-checking a few things…',
          ];
          const long = ['Nearly there, thorough answers take a moment…', 'Still with it, almost done…'];
          const pick = arr => arr[Math.floor(Math.random() * arr.length)];
          const sequence = [pick(openers), pick(working), pick(working), pick(long)];
          let i = 0;
          this.loadingText = sequence[0];
          this.loadingTimer = setInterval(() => {
            i = Math.min(i + 1, sequence.length - 1);
            this.loadingText = sequence[i];
          }, 6000);
        },

        stopLoadingCycle() {
          clearInterval(this.loadingTimer);
        },

        stop(silent) {
          if (!this.isLoading) return;
          this.controller?.abort();
          this.isLoading = false;
          this.stopLoadingCycle();
          // an interrupted streaming reply keeps its partial text, minus the caret
          const last = this.messages[this.messages.length - 1];
          if (last && last._streaming) last._streaming = false;
          // mark the interruption so Claude reads the next message as a correction
          this.history.push({ role: 'assistant', content: '(Search interrupted by the user before results came back.)' });
          this.history = this.history.slice(-12);
          if (!silent) {
            this.messages.push({ role: 'note', content: 'Search stopped — tell me what to change.' });
            this.scrollToBottom();
          }
        },

        async search(queryOverride) {
          const q = (queryOverride || this.input).trim();
          if (!q) return;
          if (this.isLoading) this.stop(true); // correcting mid-search: cancel and restart

          const myReq = ++this.reqId;
          this.controller = new AbortController();

          this.input = '';
          this.$nextTick(() => this.autosize());
          this.hasSearched = true;
          this.messages.push({ role: 'user', content: q });
          this.isLoading = true;
          this.startLoadingCycle();
          this.scrollToBottom();

          // record the user turn now so a stopped search still leaves context
          this.history.push({ role: 'user', content: q });

          try {
            // Streaming first: the recommendation types out as Claude writes
            // it, the cards land after the prose. Any transport problem falls
            // back to the plain JSON turn, so streaming can only ever add.
            await this.streamTurn(q, myReq);
          } catch (err) {
            if (err.name === 'AbortError') return; // stop() already recorded the interruption
            if (myReq !== this.reqId) return;
            this.dropStreamingMsg();
            if (err.serverTurn) {
              // the turn itself failed server-side; re-running it would just
              // pay for the same failure again
              this.messages.push({ role: 'assistant', content: `Something went wrong: ${err.message}. Try again in a moment.`, sections: [] });
              this.maybeNudge();
            } else {
              try {
                await this.plainTurn(q, myReq);
              } catch (err2) {
                if (err2.name === 'AbortError' || myReq !== this.reqId) return;
                this.messages.push({ role: 'assistant', content: `Something went wrong: ${err2.message}. Try again in a moment.`, sections: [] });
                this.maybeNudge();
              }
            }
          } finally {
            if (myReq === this.reqId) {
              this.isLoading = false;
              this.stopLoadingCycle();
              // no auto-scroll on completion — stay where the reader is
            }
          }
        },

        // the pre-streaming turn, kept verbatim as the fallback path
        async plainTurn(q, myReq) {
          const res = await fetch('/api/search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: q, history: this.history.slice(0, -1) }),
            signal: this.controller.signal,
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error);
          if (myReq !== this.reqId) return; // superseded by a newer request

          this.history.push({ role: 'assistant', content: data.message });
          this.history = this.history.slice(-12);

          (data.sections || []).forEach(sec => { sec._anchor = 'sec-' + (++this.sectionSeq); });
          this.messages.push({
            role: 'assistant',
            content: data.message,
            sections: data.sections || [],
            suggestions: data.suggestions || [],
          });
          this.maybeNudge();
        },

        async streamTurn(q, myReq) {
          this._streamBuf = '';
          this._doneData = null;
          this._typing = false;
          this._finalized = false;
          this._drainResolve = null;
          this.messages.push({ role: 'assistant', content: '', sections: [], suggestions: [], _streaming: true });

          const res = await fetch('/api/search/stream', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: q, history: this.history.slice(0, -1) }),
            signal: this.controller.signal,
          });
          if (!res.ok || !res.body || !(res.headers.get('content-type') || '').includes('text/event-stream')) {
            throw new Error('stream unavailable');
          }
          const reader = res.body.getReader();
          const dec = new TextDecoder();
          let acc = '';
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            if (myReq !== this.reqId) { reader.cancel().catch(() => {}); return; }
            acc += dec.decode(value, { stream: true });
            let idx;
            while ((idx = acc.indexOf('\n\n')) >= 0) {
              const frame = acc.slice(0, idx); acc = acc.slice(idx + 2);
              let ev = 'message', data = '';
              for (const line of frame.split('\n')) {
                if (line.startsWith('event:')) ev = line.slice(6).trim();
                else if (line.startsWith('data:')) data += line.slice(5).trim();
              }
              let body = null;
              if (data) { try { body = JSON.parse(data); } catch { continue; } }
              if (ev === 'text_delta') {
                this._streamBuf += (body || '');
                this.startTyping(myReq);
              } else if (ev === 'text_reset') {
                // whatever streamed was a lead-in to a search, not the answer
                this._streamBuf = '';
                this.liveMsg().content = '';
              } else if (ev === 'done') {
                this._doneData = body || {};
              } else if (ev === 'error') {
                const e = new Error((body && body.error) || 'server error');
                e.serverTurn = true;
                throw e;
              }
              // 'sections' frames are deliberately not rendered here: the
              // reveal order is prose first, then cards — 'done' carries all
            }
          }
          if (!this._doneData) throw new Error('stream ended without a result');
          this.startTyping(myReq); // covers a turn that streamed no text at all
          await new Promise(resolve => {
            this._drainResolve = resolve;
            this.maybeFinishStream(myReq);
          });
        },

        liveMsg() { return this.messages[this.messages.length - 1]; },

        startTyping(myReq) {
          if (this._typing) return;
          this._typing = true;
          // rAF gives the smooth 60fps cadence, but browsers starve rAF in
          // hidden or occluded tabs — without the timer watchdog, a reply
          // would never finish typing (or finalize) in a background tab
          const schedule = (fn) => {
            let ran = false;
            const run = () => { if (ran) return; ran = true; fn(); };
            const t = setTimeout(run, 120);
            requestAnimationFrame(() => { clearTimeout(t); run(); });
          };
          const tick = () => {
            if (myReq !== this.reqId) { this._typing = false; return; }
            const buf = this._streamBuf;
            if (buf.length) {
              // adaptive cadence: a deeper backlog lands more characters per
              // frame, so the typing can never fall behind the network; a
              // hidden page flushes outright — no one is watching the animation
              const n = document.hidden ? buf.length
                : Math.max(2, Math.round(buf.length / (this._doneData ? 5 : 12)));
              this.liveMsg().content += buf.slice(0, n);
              this._streamBuf = buf.slice(n);
              schedule(tick);
              return;
            }
            this._typing = false;
            if (this._doneData) this.maybeFinishStream(myReq);
            // buffer empty mid-turn: go idle; the next text_delta restarts us
          };
          schedule(tick);
        },

        maybeFinishStream(myReq) {
          const release = () => {
            const r = this._drainResolve; this._drainResolve = null; if (r) r();
          };
          if (myReq !== this.reqId || this._finalized) { release(); return; }
          if (!this._doneData || this._streamBuf.length || this._typing) return;
          const d = this._doneData;
          const msg = this.liveMsg();
          msg.content = d.message || msg.content;   // 'done' is authoritative
          (d.sections || []).forEach(sec => { sec._anchor = 'sec-' + (++this.sectionSeq); });
          msg.sections = d.sections || [];
          msg.suggestions = d.suggestions || [];
          msg._streaming = false;
          this._finalized = true;
          this.history.push({ role: 'assistant', content: d.message || '' });
          this.history = this.history.slice(-12);
          this.maybeNudge();
          release();
        },

        dropStreamingMsg() {
          const last = this.messages[this.messages.length - 1];
          if (last && last.role === 'assistant' && last._streaming) this.messages.pop();
        },

        // ---- share: a boarding-pass PNG drawn on canvas with the page's own
        // fonts; the card stays cream in every theme, like the route maps ----
        shareFlight(f) {
          const legs = f.legs || [];
          this.openShare({
            kind: 'one way',
            route: legs[0].from + ' → ' + legs[legs.length - 1].to,
            segs: [this._shareSeg('Flight', f)],
            price: this.formatPrice(f.price, f.currency),
            priceNote: 'one way, per person', url: f.booking_url,
          });
        },
        sharePairing(it) {
          if (!it) return;
          const o = it.outbound.legs;
          this.openShare({
            kind: 'round trip',
            route: o[0].from + ' → ' + o[o.length - 1].to,
            segs: [this._shareSeg('Out', it.outbound), this._shareSeg('Back', it.return)],
            price: this.formatPrice(it.total_price, it.currency),
            priceNote: 'round trip total, per person', url: it.booking_url,
          });
        },
        shareMulti(it) {
          const parts = it.parts || [];
          const chain = parts.map(p => p.legs[0].from);
          chain.push(parts[parts.length - 1].legs[parts[parts.length - 1].legs.length - 1].to);
          this.openShare({
            kind: 'multi-city',
            route: chain.join(' → '),
            segs: parts.map((p, i) => this._shareSeg('Leg ' + (i + 1), p)),
            price: this.formatPrice(it.total_price, it.currency),
            priceNote: 'total, per person' + (it.price_basis === 'separate tickets' ? ', as separate tickets' : ''),
            url: it.booking_url,
          });
        },
        _shareSeg(tag, f) {
          const legs = f.legs || [];
          const a = legs[0], b = legs[legs.length - 1];
          const codes = legs.map(l => l.airline_code + ' ' + l.flight_number).slice(0, 2).join(' · ');
          return {
            tag,
            date: this.formatDate((a.departure || '').slice(0, 10)),
            times: this.formatTime(a.departure) + ' ' + a.from + '  →  ' + this.formatTime(b.arrival) + ' ' + b.to + this.arrivalDay(f),
            meta: f.airline + ' · ' + codes + (legs.length > 2 ? ' +' : '') + ' · ' + this.stopsText(f.stops) + this.viaShort(f),
          };
        },

        async openShare(trip) {
          this.share.open = true;
          this.share.toast = '';
          this.share.imgUrl = null;
          this.share.blob = null;
          this.share.text = this._shareText(trip);
          try {
            await document.fonts.ready;
            const canvas = this._drawTripCard(trip);
            const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
            this.share.blob = blob;
            this.share.imgUrl = URL.createObjectURL(blob);
            this.share.canNative = !!(navigator.canShare && blob
              && navigator.canShare({ files: [new File([blob], 'flight.png', { type: 'image/png' })] }));
          } catch (e) {
            this.share.canNative = false;
            this._toast('Could not render the card');
          }
        },
        closeShare() {
          this.share.open = false;
          if (this.share.imgUrl) { URL.revokeObjectURL(this.share.imgUrl); this.share.imgUrl = null; }
        },
        _shareText(t) {
          const lines = ["Let's book this flight", t.route + ' · ' + t.kind];
          for (const s of t.segs) {
            lines.push((t.segs.length > 1 ? s.tag + ': ' : '') + s.date + ' · '
              + s.times.replace(/\s+/g, ' ') + ' · ' + s.meta);
          }
          lines.push(t.price + ' ' + t.priceNote);
          if (t.url && t.url !== '#') lines.push('Book: ' + t.url);
          lines.push('found on flights.evanburkeen.com');
          return lines.join('\n');
        },

        async shareCopyImage() {
          try {
            await navigator.clipboard.write([
              new ClipboardItem({ 'image/png': Promise.resolve(this.share.blob) })]);
            this._toast('Image copied');
          } catch (e) {
            this.shareDownload();
            this._toast('Clipboard blocked, saved the image instead');
          }
        },
        async shareCopyText() {
          try { await navigator.clipboard.writeText(this.share.text); this._toast('Text copied'); }
          catch (e) { this._toast('Copy blocked by the browser'); }
        },
        shareDownload() {
          const a = document.createElement('a');
          a.href = this.share.imgUrl;
          a.download = 'flight.png';
          a.click();
        },
        async shareNative() {
          try {
            await navigator.share({
              files: [new File([this.share.blob], 'flight.png', { type: 'image/png' })],
              text: this.share.text,
            });
          } catch (e) { /* user closed the sheet */ }
        },
        _toast(msg) {
          this.share.toast = msg;
          clearTimeout(this._toastTimer);
          this._toastTimer = setTimeout(() => { this.share.toast = ''; }, 2400);
        },

        _drawTripCard(t) {
          const S = 2, W = 1040, H = 196 + t.segs.length * 78 + 54;
          const c = document.createElement('canvas');
          c.width = W * S; c.height = H * S;
          const x = c.getContext('2d');
          x.scale(S, S);
          const ls = v => { try { x.letterSpacing = v; } catch (e) {} };
          x.fillStyle = '#f7eed2'; x.fillRect(0, 0, W, H);          // paper
          const P = 18, R = 14, stubX = W - 290;
          x.save();                                                  // panel
          x.shadowColor = 'rgba(90,70,40,0.28)'; x.shadowBlur = 20; x.shadowOffsetY = 5;
          x.fillStyle = '#fffdf4';
          this._rr(x, P, P, W - P * 2, H - P * 2, R); x.fill();
          x.restore();
          x.strokeStyle = 'rgba(28,26,21,0.18)'; x.lineWidth = 1;
          this._rr(x, P, P, W - P * 2, H - P * 2, R); x.stroke();
          x.setLineDash([4, 6]);                                     // perforation
          x.strokeStyle = 'rgba(28,26,21,0.3)';
          x.beginPath(); x.moveTo(stubX, P + 14); x.lineTo(stubX, H - P - 14); x.stroke();
          x.setLineDash([]);
          for (const ny of [P, H - P]) {                             // notches
            x.fillStyle = '#f7eed2';
            x.beginPath(); x.arc(stubX, ny, 9, 0, 7); x.fill();
            x.strokeStyle = 'rgba(28,26,21,0.18)';
            x.beginPath(); x.arc(stubX, ny, 9, 0, 7); x.stroke();
          }
          const L = P + 28, mainW = stubX - L - 24;
          ls('3px');
          x.fillStyle = '#8a6d2f'; x.font = '600 13px Inter';
          x.fillText("LET'S BOOK THIS FLIGHT", L, P + 42);
          ls('0px');
          x.fillStyle = '#1c1a15'; x.font = '600 44px Fraunces, Georgia, serif';
          x.fillText(this._fit(x, t.route, mainW), L, P + 94);
          x.fillStyle = 'rgba(28,26,21,0.6)'; x.font = '500 15px Inter';
          x.fillText(t.kind, L, P + 120);
          let y = P + 162;
          for (const s of t.segs) {
            ls('2px');
            x.fillStyle = '#0f4c5c'; x.font = '700 12px Inter';
            x.fillText(s.tag.toUpperCase(), L, y);
            ls('0px');
            x.fillStyle = '#1c1a15'; x.font = '600 21px Inter';
            x.fillText(this._fit(x, s.date + ' · ' + s.times, mainW), L, y + 27);
            x.fillStyle = 'rgba(28,26,21,0.58)'; x.font = '400 15px Inter';
            x.fillText(this._fit(x, s.meta, mainW), L, y + 50);
            y += 78;
          }
          ls('2px');
          x.fillStyle = '#8a6d2f'; x.font = '600 11px Inter';
          x.fillText('FLIGHTS.EVANBURKEEN.COM', L, H - P - 18);
          ls('0px');
          const px = stubX + 26;                                     // stub
          x.fillStyle = '#8a3416'; x.font = '600 40px Fraunces, Georgia, serif';
          x.fillText(this._fit(x, t.price, W - px - P - 14), px, P + 94);
          x.fillStyle = 'rgba(28,26,21,0.6)'; x.font = '500 13px Inter';
          this._wrap(x, t.priceNote, px, P + 118, W - px - P - 14, 18);
          return c;
        },
        _rr(x, a, b, w, h, r) {
          x.beginPath();
          x.moveTo(a + r, b);
          x.arcTo(a + w, b, a + w, b + h, r);
          x.arcTo(a + w, b + h, a, b + h, r);
          x.arcTo(a, b + h, a, b, r);
          x.arcTo(a, b, a + w, b, r);
          x.closePath();
        },
        _fit(x, text, maxW) {
          let s = text || '';
          if (x.measureText(s).width <= maxW) return s;
          while (s.length > 1 && x.measureText(s + '…').width > maxW) s = s.slice(0, -1);
          return s + '…';
        },
        _wrap(x, text, a, b, maxW, lh) {
          let line = '', yy = b;
          for (const w of (text || '').split(' ')) {
            const test = line ? line + ' ' + w : w;
            if (x.measureText(test).width > maxW && line) { x.fillText(line, a, yy); line = w; yy += lh; }
            else line = test;
          }
          if (line) x.fillText(line, a, yy);
        },

        pickDate(d) {
          let q = `Show me the flights for ${d.date}`;
          if (d.return_date) q += `, returning ${d.return_date}`;
          this.search(q);
        },

        sectionLabel(sec) {
          const msg = sec.message || '';
          return msg.split('\n')[0];
        },

        visibleSections(msg) {
          // empty searches (transient hiccups the assistant retried) stay out
          // of the page; the reply text already tells that story. A section
          // with only from-priced outbounds (degraded round trip) DOES show:
          // every row is one tap from priced.
          return (msg.sections || []).filter(s =>
            (s.results || []).length || (s.dates || []).length || (s.more_outbounds || []).length);
        },

        ladder() {
          const items = [];
          for (const m of this.messages) {
            for (const sec of m.sections || []) {
              if (sec._anchor && ((sec.results || []).length || (sec.dates || []).length || (sec.more_outbounds || []).length)) {
                items.push({ anchor: sec._anchor, label: this.sectionLabel(sec) });
              }
            }
          }
          return items;
        },

        jumpTo(anchor) {
          document.getElementById(anchor)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        },

        renderText(t) {
          // the server strips the trailing SUGGESTIONS line, but belt and
          // braces: never render it if one slips through
          const esc = (t || '').replace(/\n*SUGGESTIONS:[\s\S]*$/, '')
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          // the model sometimes hard-wraps mid-sentence; join single newlines
          // into flowing text but keep paragraph breaks and list lines
          const PARA = '\u0001', LIST = '\u0002';
          const flowed = esc
            .replace(/\n{2,}/g, PARA)
            .replace(/\n(?=\s*(?:[-*\u2022]|\d+[.)])\s)/g, LIST)
            .replace(/\n/g, ' ')
            .replace(/\u0001/g, '\n\n')
            .replace(/\u0002/g, '\n');
          return flowed.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        },

        greeting() {
          const h = new Date().getHours();
          return h < 5 ? 'Burning the midnight oil.' : h < 12 ? 'Good morning.' : h < 18 ? 'Good afternoon.' : 'Good evening.';
        },

        longToday() {
          return new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
        },

        cleanAircraft(name) {
          // Google sends e.g. "Boeing 737MAX 8 Passenger"; show "Boeing 737 MAX 8".
          // Variants (777-300ER, A330-900neo) appear whenever Google includes them.
          return (name || '')
            .replace(/\s*(Passenger|Freighter|Cargo)\s*$/i, '')
            .replace(/(\d)\s*MAX\s*(\d)/i, '$1 MAX $2')
            .trim();
        },

        aircraftText(f) {
          const legs = f.legs || [];
          return [...new Set(legs.map(l => this.cleanAircraft(l.aircraft)).filter(Boolean))].join(' + ');
        },

        operatedBy(f) {
          const ops = [...new Set((f.legs || []).map(l => l.operated_by).filter(o => o && o !== f.airline))];
          return ops.length ? 'Operated by ' + ops.join(', ') : '';
        },

        ecoBadge(f) {
          const d = f.co2_delta_pct;
          return (d != null && d <= -5) ? Math.round(Math.abs(d)) + '% less CO₂' : '';
        },

        mapSvg(points, returnPoints) {
          const norm = arr => (arr || []).filter(p => p && p.lat != null);
          const pts1 = norm(points), pts2 = norm(returnPoints);
          if (pts1.length < 2) return '';
          // equirectangular, same frame as WORLD_PATH: x = lon+180, y = 90-lat.
          // Longitudes unwrap SEQUENTIALLY so every leg takes the short way
          // around the globe (a global shift breaks multi-leg routes whose
          // total span exceeds 180 degrees, e.g. FLL-BOS-CDG-PVG).
          const unwrapSeq = (pts, anchorX) => {
            const out = [];
            let prev = anchorX;
            for (const p of pts) {
              let x = p.lon + 180;
              if (prev != null) {
                while (x - prev > 180) x -= 360;
                while (prev - x > 180) x += 360;
              }
              out.push({ x, y: 90 - p.lat, code: p.code, layover: p.layover_min });
              prev = x;
            }
            return out;
          };
          const P = unwrapSeq(pts1, null);
          const R = unwrapSeq(pts2, P.length ? P[P.length - 1].x : null);
          const allP = [...P, ...R];
          const xs = allP.map(p => p.x), ys = allP.map(p => p.y);

          let minX = Math.min(...xs), maxX = Math.max(...xs);
          let minY = Math.min(...ys), maxY = Math.max(...ys);
          // padding is capped so long-haul routes stay framed on the route,
          // not zoomed out to the whole planet
          const padX = Math.min(Math.max((maxX - minX) * 0.35, 6), 16);
          const padY = Math.min(Math.max((maxY - minY) * 0.5, 5), 12);
          minX -= padX; maxX += padX; minY -= padY; maxY += padY;
          // widen to a pleasant aspect ratio (~3:1)
          const w = maxX - minX, h = maxY - minY;
          if (w / h < 2.6) { const extra = (h * 2.6 - w) / 2; minX -= extra; maxX += extra; }
          else if (w / h > 4.5) { const extra = (w / 4.5 - h) / 2; minY -= extra; maxY += extra; }

          const vb = `${minX.toFixed(1)} ${minY.toFixed(1)} ${(maxX - minX).toFixed(1)} ${(maxY - minY).toFixed(1)}`;
          const sw = (maxX - minX) / 300; // stroke scale
          const arc = (a, b, lift) => {
            const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
            const dx = b.x - a.x, dy = b.y - a.y;
            const len = Math.hypot(dx, dy) || 1;
            const k = lift * Math.min(len * 0.18, 6);
            return `M${a.x} ${a.y} Q${mx - dy / len * k} ${my - dx / len * -k} ${b.x} ${b.y}`;
          };
          let route = '';
          for (let i = 0; i < P.length - 1; i++) route += `<path d="${arc(P[i], P[i+1], 1)}" fill="none" stroke="#b1471f" stroke-width="${sw * 2}"/>`;
          // return legs: dashed, bowed the opposite way so both directions read
          for (let i = 0; i < R.length - 1; i++) route += `<path d="${arc(R[i], R[i+1], -1)}" fill="none" stroke="#8a3416" stroke-width="${sw * 1.8}" stroke-dasharray="${sw * 3.5} ${sw * 2.5}"/>`;

          const fmtLay = m => m >= 60 ? Math.floor(m / 60) + 'h' + (m % 60 ? String(m % 60).padStart(2, '0') : '') : m + 'm';
          const seen = new Set();
          const endpoints = new Set([P[0]?.code, P[P.length - 1]?.code, R[0]?.code, R[R.length - 1]?.code]);
          const dots = allP.filter(p => !seen.has(p.code) && seen.add(p.code)).map(p => {
            const end = endpoints.has(p.code);
            const nearTop = p.y < minY + (maxY - minY) * 0.24;
            const labelY = nearTop ? p.y + sw * 12 : p.y - sw * 5;
            let t = `<circle cx="${p.x}" cy="${p.y}" r="${sw * (end ? 3.2 : 2.2)}" fill="${end ? '#1c1a15' : '#b1471f'}"/>` +
                    `<text x="${p.x}" y="${labelY}" font-size="${sw * 9}" text-anchor="middle" fill="#1c1a15" font-family="Inter, sans-serif" font-weight="600">${p.code}</text>`;
            if (!end && p.layover) {
              const layY = nearTop ? labelY + sw * 9.5 : p.y + sw * 10;
              t += `<text x="${p.x}" y="${layY}" font-size="${sw * 7}" text-anchor="middle" fill="#8a3416" font-family="Inter, sans-serif" font-weight="500">${fmtLay(p.layover)}</text>`;
            }
            return t;
          }).join('');

          // land + lakes drawn across three 360-degree spans so no edge of the
          // crop ever runs out of world; lakes punch through in the ocean color
          const OCEAN = '#f2ebd3', LAND = '#e7dab0', COAST = '#c9b478';
          let ground = '';
          for (const dx of [-720, -360, 0, 360, 720]) {
            const t = dx ? ` transform="translate(${dx},0)"` : '';
            ground += `<use href="#worldpath"${t} fill="${LAND}" stroke="${COAST}" stroke-width="${sw * 0.6}"/>`;
            ground += `<use href="#lakespath"${t} fill="${OCEAN}" stroke="${COAST}" stroke-width="${sw * 0.4}"/>`;
          }
          // ocean + graticule must extend well past the viewBox: with
          // preserveAspectRatio="meet" the letterbox margins show extra world
          const exW = (maxX - minX) * 1.6, exH = (maxY - minY) * 1.6;
          const eMinX = minX - exW, eMaxX = maxX + exW;
          const eMinY = minY - exH, eMaxY = maxY + exH;

          // faint graticule every 20 degrees for the atlas feel
          let grid = '';
          for (let gx = Math.ceil(eMinX / 20) * 20; gx <= eMaxX; gx += 20)
            grid += `<line x1="${gx}" y1="${eMinY.toFixed(1)}" x2="${gx}" y2="${eMaxY.toFixed(1)}"/>`;
          for (let gy = Math.max(0, Math.ceil(eMinY / 20) * 20); gy <= Math.min(180, eMaxY); gy += 20)
            grid += `<line x1="${eMinX.toFixed(1)}" y1="${gy}" x2="${eMaxX.toFixed(1)}" y2="${gy}"/>`;
          grid = `<g stroke="#1c1a15" stroke-opacity="0.07" stroke-width="${sw * 0.5}">${grid}</g>`;

          return `<svg viewBox="${vb}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">` +
            `<rect x="${eMinX.toFixed(1)}" y="${eMinY.toFixed(1)}" width="${(eMaxX - eMinX).toFixed(1)}" height="${(eMaxY - eMinY).toFixed(1)}" fill="${OCEAN}"/>` +
            ground + grid + route + dots + `</svg>`;
        },

        airlineColor(code) {
          const palette = ['#0f4c5c', '#a3492a', '#5c4a72', '#2c5e3f', '#8a6d2f', '#33547a', '#8c3a52', '#55524a'];
          let h = 0;
          for (const ch of (code || '??')) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
          return palette[h % palette.length];
        },

        // Round trips are chosen the way Google does it: the card is an
        // OUTBOUND priced at the best total it can reach, and picking a return
        // swaps the leg in place so the total moves with the choice.
        isPickedReturn(it, ri) {
          const opts = it.return_options || [];
          const cur = it.return;
          return opts[ri] && cur && opts[ri].legs[0].departure === cur.legs[0].departure
            && opts[ri].legs[0].flight_number === cur.legs[0].flight_number;
        },

        // ---- round-trip mix & match board ----
        // rows are either priced groups (sec.results members, mutated in
        // place so the top-pick cards stay in sync) or thin wrappers around
        // more_outbounds flights; wrappers are rebuilt per render, so
        // selection is tracked by key, never by object identity
        rtKey(row) {
          const legs = (row.outbound || {}).legs || [];
          return (legs[0] ? legs[0].departure : '') + '|' + legs.map(l => l.airline_code + l.flight_number).join(',');
        },

        rtAll(sec) {
          const fetched = sec._fetched || {};
          const more = (sec.more_outbounds || []).map(x => {
            const w = { outbound: x, unpriced: true, from_total: x.from_total, currency: x.currency };
            // a row priced on demand via /api/returns graduates to a full group
            return fetched[this.rtKey(w)] || w;
          });
          return (sec.results || []).concat(more);
        },

        _rowPass(f, flt) {
          if (flt.dep) {
            const h = f.legs && f.legs[0].departure ? parseInt(f.legs[0].departure.slice(11, 13), 10) : 0;
            const ok = flt.dep === 'early' ? h < 8 : flt.dep === 'morning' ? (h >= 8 && h < 12)
              : flt.dep === 'afternoon' ? (h >= 12 && h < 18) : h >= 18;
            if (!ok) return false;
          }
          if (flt.maxDur && (f.duration ?? 1e9) > flt.maxDur * 60) return false;
          if (flt.airline && !(f.legs || []).some(l => l.airline_code === flt.airline)) return false;
          if (flt.alliance && f.alliance !== flt.alliance) return false;
          if (flt.stops !== '' && flt.stops != null && (f.stops ?? 9) > +flt.stops) return false;
          return true;
        },

        rtOutbounds(sec) {
          const flt = sec._filters || {};
          let rows = this.rtAll(sec).filter(g => this._rowPass(g.outbound, flt));
          const price = g => (g.unpriced ? g.from_total : (g.cheapest_total ?? g.total_price)) ?? 1e9;
          if (flt.sort === 'price') rows = [...rows].sort((a, b) => price(a) - price(b));
          else if (flt.sort === 'duration') rows = [...rows].sort((a, b) => (a.outbound.duration ?? 1e9) - (b.outbound.duration ?? 1e9));
          else if (flt.sort === 'departure') rows = [...rows].sort((a, b) => (a.outbound.legs[0].departure || '').localeCompare(b.outbound.legs[0].departure || ''));
          return rows;
        },

        rtSelected(sec) {
          const rows = this.rtOutbounds(sec);
          return rows.find(g => this.rtKey(g) === sec._selKey) || rows[0] || null;
        },

        rtIsSel(sec, g) {
          const s = this.rtSelected(sec);
          return !!s && this.rtKey(s) === this.rtKey(g);
        },

        rtSelect(sec, g) {
          sec._selKey = this.rtKey(g);
          // tapping a from-priced row IS the request to price it
          if (g.unpriced && sec.spec_echo && !(sec._fetched || {})[sec._selKey]
              && !(sec._fetching || {})[sec._selKey] && !(sec._fetchErr || {})[sec._selKey]) {
            this.rtFetchReturns(sec, g);
          }
        },

        rtFetchState(sec) {
          const g = this.rtSelected(sec);
          if (!g) return 'idle';
          const key = this.rtKey(g);
          return (sec._fetching || {})[key] ? 'loading'
            : (sec._fetchErr || {})[key] ? 'error' : 'idle';
        },

        rtPrice(sec) {
          const g = this.rtSelected(sec);
          if (!g) return;
          if (sec.spec_echo) this.rtFetchReturns(sec, g);
          else this.rtAskReturns(sec);   // sections from before spec_echo shipped
        },

        async rtFetchReturns(sec, g) {
          const key = this.rtKey(g);
          if ((sec._fetching || {})[key]) return;
          sec._fetching = { ...(sec._fetching || {}), [key]: true };
          const err = { ...(sec._fetchErr || {}) }; delete err[key]; sec._fetchErr = err;
          try {
            const resp = await fetch('/api/returns', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                spec: sec.spec_echo,
                from_total: g.unpriced ? g.from_total : g.cheapest_total,
                outbound: { legs: (g.outbound.legs || []).map(l => ({
                  airline_code: l.airline_code, flight_number: l.flight_number,
                  departure: l.departure, arrival: l.arrival, from: l.from, to: l.to })) },
              }),
            });
            const data = await resp.json();
            if (!resp.ok || data.error || !(data.return_options || []).length) {
              throw new Error(data.error || 'no returns');
            }
            const best = data.return_options[0];
            if (g.unpriced) {
              sec._fetched = { ...(sec._fetched || {}), [key]: {
                outbound: g.outbound, return_options: data.return_options,
                cheapest_total: data.cheapest_total, currency: data.currency,
                total_price: best.total_price, return: best,
                booking_url: best.booking_url, _full: true,
              } };
            } else {
              // keep the traveler's pick when the fuller list still has it
              const cur = g.return;
              g.return_options = data.return_options;
              const match = cur && data.return_options.find(r =>
                r.legs[0].departure === cur.legs[0].departure
                && r.legs[0].flight_number === cur.legs[0].flight_number);
              const pick = match || best;
              g.return = pick; g.total_price = pick.total_price;
              if (pick.booking_url) g.booking_url = pick.booking_url;
              g._full = true;
            }
          } catch (e) {
            sec._fetchErr = { ...(sec._fetchErr || {}), [key]: true };
          } finally {
            const f = { ...(sec._fetching || {}) }; delete f[key]; sec._fetching = f;
          }
        },

        rtReturns(sec) {
          const g = this.rtSelected(sec);
          if (!g || g.unpriced) return [];
          const flt = sec._filters || {};
          let rows = (g.return_options || []).filter(r => this._rowPass(r,
            { stops: flt.stops, airline: flt.airline, alliance: flt.alliance, maxDur: flt.maxDur }));
          if (flt.sort === 'price') rows = [...rows].sort((a, b) => (a.total_price ?? 1e9) - (b.total_price ?? 1e9));
          else if (flt.sort === 'duration') rows = [...rows].sort((a, b) => (a.duration ?? 1e9) - (b.duration ?? 1e9));
          else if (flt.sort === 'departure') rows = [...rows].sort((a, b) => (a.legs[0].departure || '').localeCompare(b.legs[0].departure || ''));
          return rows;
        },

        pickReturnOpt(g, r) {
          g.return = r;
          if (r.total_price != null) g.total_price = r.total_price;
          if (r.booking_url) g.booking_url = r.booking_url;
        },

        isPickedOpt(g, r) {
          const c = g.return;
          return !!c && r.legs[0].departure === c.legs[0].departure
            && r.legs[0].flight_number === c.legs[0].flight_number;
        },

        rtCurrency(g) { return g.currency || (g.outbound || {}).currency || 'USD'; },

        viaShort(f) {
          const ls = f.layovers || [];
          return ls.length ? ' via ' + ls.map(l => l.airport).join(', ') : '';
        },

        rtOutCount(sec) {
          const total = this.rtAll(sec).length, shown = this.rtOutbounds(sec).length;
          return '· ' + (shown === total ? total : shown + ' of ' + total);
        },

        rtRetNote(sec) {
          const g = this.rtSelected(sec);
          if (!g || g.unpriced) return '';
          const total = (g.return_options || []).length;
          const shown = this.rtReturns(sec).length;
          const legs = (g.return || {}).legs || [];
          const d = legs.length ? this.formatDate((legs[0].departure || '').slice(0, 10)) : '';
          const count = shown < total ? shown + ' of ' + total + ' options' : total + ' option' + (total === 1 ? '' : 's');
          return '· ' + count + (d ? ' · ' + d : '');
        },

        rtAskReturns(sec) {
          const g = this.rtSelected(sec);
          if (!g) return;
          const legs = (g.outbound || {}).legs || [];
          if (!legs.length) return;
          this.search('Price the returns for the ' + g.outbound.airline + ' outbound departing '
            + this.formatDate((legs[0].departure || '').slice(0, 10)) + ' at '
            + this.formatTime(legs[0].departure) + ' from ' + legs[0].from);
        },

        rtSummaryText(sec) {
          const g = this.rtSelected(sec);
          if (!g || g.unpriced) return '';
          const seg = legs => legs && legs.length
            ? legs[0].from + ' ' + this.formatTime(legs[0].departure) + ' → '
              + legs[legs.length - 1].to + ' ' + this.formatTime(legs[legs.length - 1].arrival)
            : '';
          return 'Out ' + seg(g.outbound.legs) + '    ·    Back ' + seg((g.return || {}).legs);
        },

        pickReturn(it, ri) {
          const r = (it.return_options || [])[ri];
          if (!r) return;
          it.return = r;
          if (r.total_price != null) it.total_price = r.total_price;
          if (r.booking_url) it.booking_url = r.booking_url;  // book what's shown
        },

        badgeClass(h) {
          const t = (h || '').toLowerCase();
          if (t.includes('best value')) return 'badge-best';
          if (t.includes('direct')) return 'badge-direct';
          if (t.includes('cheap')) return 'badge-cheap';
          if (t.includes('fast') || t.includes('quick')) return 'badge-fast';
          return 'badge-plain';
        },

        flightCodes(f) {
          const codes = (f.legs || []).map(l => l.airline_code + ' ' + l.flight_number).join(' · ');
          return f.alliance ? codes + ' · ' + f.alliance : codes;
        },

        stopsText(stops) {
          return stops === 0 ? 'Direct' : stops + ' stop' + (stops > 1 ? 's' : '');
        },

        stopPositions(f) {
          // place each connection on the timeline proportional to elapsed time
          const legs = f.legs || [];
          if (legs.length < 2) return [];
          const t0 = Date.parse(legs[0].departure || '');
          const t1 = Date.parse(legs[legs.length - 1].arrival || '');
          if (!t0 || !t1 || t1 <= t0) return [];
          return legs.slice(0, -1).map((l, i) => {
            const a = Date.parse(l.arrival || ''), d = Date.parse(legs[i + 1].departure || '');
            const mid = a && d ? (a + d) / 2 : (a || d);
            return { code: l.to, pct: Math.min(94, Math.max(6, ((mid - t0) / (t1 - t0)) * 100)) };
          }).filter(s => isFinite(s.pct));
        },

        arrivalDay(f) {
          const legs = f.legs || [];
          if (!legs.length) return '';
          const dep = (legs[0].departure || '').slice(0, 10);
          const arr = (legs[legs.length - 1].arrival || '').slice(0, 10);
          if (!dep || !arr || dep === arr) return '';
          const days = Math.round((new Date(arr + 'T12:00:00') - new Date(dep + 'T12:00:00')) / 86400000);
          return days > 0 ? ` +${days}` : '';
        },

        layoverText(lo) {
          const dur = lo.duration ? Math.floor(lo.duration / 60) + 'h ' + (lo.duration % 60) + 'm' : '';
          return `Layover: ${dur} in ${lo.city || lo.airport} (${lo.airport})`;
        },

        formatPrice(p, currency) {
          if (p == null) return '—';
          try {
            return new Intl.NumberFormat('en-US', {
              style: 'currency', currency: currency || 'USD',
              minimumFractionDigits: 0, maximumFractionDigits: 0,
            }).format(p);
          } catch { return (currency || '$') + ' ' + Math.round(p); }
        },

        formatTime(t) {
          if (!t) return '—';
          if (t.includes('T')) return t.split('T')[1]?.slice(0, 5) || '—';
          return t.slice(0, 5);
        },

        formatDate(d) {
          if (!d) return '';
          const dt = new Date(d + 'T12:00:00');
          return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        },

        formatDuration(mins) {
          if (!mins) return '';
          return `${Math.floor(mins / 60)}h ${mins % 60}m`;
        },
      };
    }
  </script>
</body>
</html>
