<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flight Assistant — Evan Burkeen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:ital,wght@0,600;1,600&display=swap" rel="stylesheet" />
  <script>
    // theme runs before first paint to avoid a flash of the wrong theme;
    // light is the default — dark only when explicitly chosen
    (function () {
      function apply() {
        document.documentElement.classList.toggle('dark', localStorage.getItem('flightTheme') === 'dark');
      }
      apply();
      window.__applyTheme = apply;
    })();
  </script>
  <script src="/world.js?v=2"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7eed2;
      --ink: #1c1a15;
      --line: rgba(28, 26, 21, 0.16);
      --line-strong: rgba(28, 26, 21, 0.30);
      --rule-strong: rgba(28, 26, 21, 0.25);
      --rule-soft: rgba(28, 26, 21, 0.12);
      --panel: #fffdf4;
      --accent: #b1471f;
      --accent-dark: #8a3416;
      --good: #3c6e2f;
      --good-bg: rgba(60, 110, 47, 0.10);
      --info: #0f4c5c;
      --info-bg: rgba(15, 76, 92, 0.10);
      --warn: #92400e;
      --warn-bg: rgba(146, 64, 14, 0.10);
      --brass: #8a6d2f;
      --brass-soft: rgba(138, 109, 47, 0.4);
      --green: #2c4636;
      /* calendar heat tiers: 0 = at/near the cheapest, 4 = the priciest days */
      --heat0: rgba(60, 110, 47, 0.24);
      --heat1: rgba(60, 110, 47, 0.12);
      --heat2: rgba(28, 26, 21, 0.04);
      --heat3: rgba(177, 71, 31, 0.10);
      --heat4: rgba(177, 71, 31, 0.20);
      --card-shadow: 0 1px 2px rgba(90, 70, 40, 0.05), 0 8px 22px -12px rgba(90, 70, 40, 0.28);
      --card-shadow-hover: 0 2px 4px rgba(90, 70, 40, 0.06), 0 14px 30px -12px rgba(90, 70, 40, 0.35);
      --serif: Fraunces, Georgia, "Times New Roman", serif;
      /* one definition of the paper, shared by the page and the fixed compose
         bar: when the bar had a flat fill it read as a different shade of
         cream and the join showed as a band across the bottom */
      --paper:
        repeating-linear-gradient(0deg, rgba(28,26,21,0.014) 0 1px, transparent 1px 3px),
        repeating-linear-gradient(90deg, rgba(28,26,21,0.014) 0 1px, transparent 1px 3px),
        radial-gradient(circle at 85% -10%, rgba(177, 71, 31, 0.08), transparent 45%);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      background-image: var(--paper);
      /* short pages (the landing screen) otherwise stop painting the texture
         partway down, leaving an untextured strip at the bottom */
      min-height: 100vh;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    button, input, textarea { font-family: inherit; }

    .container { max-width: 58rem; margin: 0 auto; padding: 2.5rem 1.5rem 8rem; }

    .header {
      margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: flex-end;
      gap: 1rem; flex-wrap: wrap; padding-bottom: 1.1rem; position: relative;
    }
    .header::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: 0;
      border-bottom: 1px solid var(--rule-strong);
    }
    .header::before {
      content: ""; position: absolute; left: 0; right: 0; bottom: 3px;
      border-bottom: 1px solid var(--rule-soft);
    }
    .masthead { display: flex; align-items: center; gap: 0.9rem; }
    .crest {
      width: 3rem; height: 3rem; border-radius: 50%; flex: none;
      border: 1px solid var(--brass); box-shadow: inset 0 0 0 2.5px var(--bg), inset 0 0 0 3.5px var(--brass-soft);
      background: linear-gradient(140deg, rgba(138,109,47,0.16), rgba(138,109,47,0.04));
      display: flex; align-items: center; justify-content: center;
      color: var(--brass); font-size: 1.15rem; transform: rotate(-8deg);
    }
    .header h1 {
      font-family: var(--serif);
      font-size: 2.5rem; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 0.15rem;
    }
    .header h1 em { font-style: italic; color: var(--accent); }
    .header p {
      font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--brass); font-weight: 600;
    }

    .hero { margin: 0.75rem 0 1.9rem; }
    .hero .date {
      font-size: 0.68rem; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--brass); font-weight: 600; margin-bottom: 0.5rem;
    }
    .hero .hello {
      font-family: var(--serif); font-style: italic; font-weight: 600;
      font-size: 2.4rem; color: var(--accent-dark); margin-bottom: 0.25rem;
    }
    .hero .ask { font-family: var(--serif); font-style: italic; font-size: 1.05rem; opacity: 0.78; }

    .header-tools { display: flex; align-items: center; gap: 0.5rem; flex: none; margin-bottom: 0.35rem; }
    .theme-btn {
      width: 2rem; height: 2rem; border-radius: 50%; flex: none;
      border: 1px solid var(--line); background: var(--panel); color: var(--brass);
      font-size: 0.85rem; line-height: 1; cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .theme-btn:hover { border-color: var(--brass); }
    .view-toggle {
      display: inline-flex; border: 1px solid var(--line); border-radius: 999px;
      overflow: hidden; background: var(--panel); flex: none;
    }
    .view-toggle button {
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
      padding: 0.4rem 0.9rem; border: none; background: transparent; color: var(--ink);
      cursor: pointer; transition: all 0.15s; opacity: 0.65;
    }
    .view-toggle button.active { background: var(--green); color: #f3ecd6; opacity: 1; }

    .compact-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr));
      gap: 0.5rem;
    }
    .compact-card {
      border: 1px solid var(--line); background: var(--panel);
      border-radius: 8px; padding: 0.65rem 0.75rem;
      display: flex; flex-direction: column; gap: 0.25rem;
      box-shadow: var(--card-shadow);
    }
    .compact-top { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; }
    .compact-airline { font-size: 0.72rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .compact-price { font-family: var(--serif); font-size: 1.15rem; font-weight: 600; color: var(--accent-dark); flex: none; }
    .compact-times { font-size: 0.82rem; font-weight: 600; }
    .compact-sub { font-size: 0.68rem; opacity: 0.70; }
    .compact-leg { font-size: 0.72rem; }
    .compact-leg .lbl { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.55; margin-right: 0.3rem; }
    .compact-badges { display: flex; flex-wrap: wrap; gap: 0.25rem; }
    .compact-badges .badge { font-size: 0.58rem; padding: 0.08rem 0.35rem; }
    .compact-warn { font-size: 0.64rem; color: var(--warn); }
    .compact-book {
      font-size: 0.64rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
      color: var(--accent-dark); text-decoration: none; margin-top: auto;
    }
    .compact-book:hover { text-decoration: underline; }

    /* landing */
    .capabilities {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr));
      gap: 0.75rem; margin-bottom: 2rem;
    }
    .cap {
      border: 1px solid var(--line); background: var(--panel);
      padding: 0.9rem 1rem; border-radius: 8px;
      box-shadow: var(--card-shadow);
    }
    .cap .cap-title { font-size: 0.8rem; font-weight: 600; margin-bottom: 0.2rem; }
    .cap .cap-title span { color: var(--accent); margin-right: 0.35rem; }
    .cap .cap-body { font-size: 0.75rem; opacity: 0.72; line-height: 1.5; }

    .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 2rem; }
    .chip {
      font-size: 0.75rem; padding: 0.45rem 0.8rem; border-radius: 999px;
      border: 1px solid var(--line); background: var(--panel);
      cursor: pointer; transition: all 0.15s; color: var(--ink);
    }
    .chip:hover { border-color: var(--accent); color: var(--accent-dark); }
    .suggest-chips { margin-bottom: 0; margin-top: 0.25rem; }
    .suggest-chips .chip { border-color: var(--brass-soft); color: var(--brass); font-weight: 500; }
    .suggest-chips .chip::before { content: "→ "; opacity: 0.6; }
    .suggest-chips .chip:hover { background: var(--brass); border-color: var(--brass); color: var(--bg); }

    .messages { display: flex; flex-direction: column; gap: 1.5rem; margin-bottom: 2rem; }
    .messages > div { animation: rise 0.35s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .messages > div { animation: none; } .flight-card:hover { transform: none; } }

    .msg-user {
      align-self: flex-end; max-width: 85%;
      background: var(--green); color: var(--bg);
      padding: 0.6rem 1rem; border-radius: 14px 14px 3px 14px;
      font-size: 0.875rem; line-height: 1.55; white-space: pre-wrap;
      box-shadow: 0 1px 4px rgba(28,26,21,0.12);
    }

    .msg-assistant { display: flex; flex-direction: column; gap: 1rem; }
    .msg-text {
      font-size: 0.9rem; line-height: 1.65; white-space: pre-wrap; max-width: 46rem;
      border-left: 2px solid var(--accent); padding-left: 1rem;
    }

    .section-head { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; margin-bottom: 0.4rem; }
    .section-label {
      font-family: var(--serif);
      font-size: 1.05rem; letter-spacing: 0;
      color: var(--accent-dark); font-weight: 600;
      white-space: pre-line; display: flex; align-items: center; gap: 0.6rem;
    }
    .section-label::before {
      content: ""; width: 1.6rem; border-top: 1px solid rgba(177, 71, 31, 0.4); flex: none;
    }
    .mini-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--panel); flex: none; }
    .mini-toggle button {
      font-size: 0.6rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
      padding: 0.2rem 0.55rem; border: none; background: transparent; color: var(--ink);
      cursor: pointer; opacity: 0.6;
    }
    .mini-toggle button.active { background: var(--green); color: #f3ecd6; opacity: 1; }

    .filter-bar { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; margin-bottom: 0.5rem; }
    .fselect {
      font-size: 0.68rem; padding: 0.26rem 0.5rem; border: 1px solid var(--line);
      border-radius: 6px; background: var(--panel); color: var(--ink);
    }
    .fcount { font-size: 0.66rem; opacity: 0.60; margin-left: auto; }
    .show-all {
      width: 100%; margin-top: 0.5rem; font-size: 0.78rem; font-weight: 500;
      letter-spacing: 0.02em; padding: 0.5rem;
      border: 1px dashed var(--line-strong); border-radius: 6px;
      background: transparent; color: var(--brass); cursor: pointer; transition: border-color 0.15s;
    }
    .show-all:hover { border-color: var(--accent); }
    .assumptions { font-size: 0.72rem; opacity: 0.60; margin-top: 0.35rem; }

    .flight-list { display: flex; flex-direction: column; gap: 0.6rem; }

    .flight-card {
      border: 1px solid var(--line); background: var(--panel);
      border-radius: 10px; padding: 1rem 1.1rem;
      box-shadow: var(--card-shadow);
      transition: border-color 0.18s, box-shadow 0.18s, transform 0.18s;
    }
    .flight-card:hover {
      border-color: rgba(138, 109, 47, 0.45);
      box-shadow: var(--card-shadow-hover);
      transform: translateY(-1px);
    }

    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.65rem; gap: 0.75rem; }
    .airline-id { display: flex; align-items: center; gap: 0.6rem; min-width: 0; }
    .airline-avatar {
      width: 2rem; height: 2rem; border-radius: 50%; flex: none;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.02em;
    }
    .card-airline { font-size: 0.875rem; font-weight: 600; }
    .card-code { font-size: 0.72rem; opacity: 0.60; }
    .card-price { font-family: var(--serif); font-size: 1.5rem; font-weight: 600; text-align: right; color: var(--accent-dark); }
    .card-price-note { font-size: 0.68rem; opacity: 0.60; text-align: right; }

    .route { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; }
    .route-end { text-align: center; flex: none; }
    .route-time { font-size: 1rem; font-weight: 600; }
    .route-port { font-size: 0.7rem; opacity: 0.65; }
    .route-mid { flex: 1; text-align: center; position: relative; }
    .route-line { border-top: 1.5px solid var(--line-strong); position: relative; top: 0.05rem; }
    .route-line::after {
      content: "✈"; position: absolute; right: -2px; top: 0;
      transform: translateY(-50%); line-height: 1; display: block;
      font-size: 0.8rem; color: var(--accent);
    }
    .route-meta { font-size: 0.68rem; opacity: 0.70; margin-top: 0.3rem; }
    .route-stop {
      position: absolute; top: 0.05rem; transform: translate(-50%, -50%);
      width: 0.44rem; height: 0.44rem; border-radius: 50%;
      background: var(--bg); border: 1.5px solid var(--accent);
    }
    .route-stop-label {
      position: absolute; top: -0.95rem; left: 50%; transform: translateX(-50%);
      font-size: 0.56rem; font-weight: 700; letter-spacing: 0.03em;
      color: var(--accent-dark); white-space: nowrap;
    }

    .route-map {
      margin: 0.5rem 0 0.25rem; border: 1px solid #d9cb9c; border-radius: 8px;
      overflow: hidden; background: #f2ebd3;
      box-shadow: inset 0 1px 8px rgba(90, 70, 40, 0.16);
    }
    .route-map svg { display: block; width: 100%; height: 6rem; }

    .leg-label {
      display: inline-block; font-size: 0.62rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      padding: 0.1rem 0.45rem; border-radius: 3px; margin-bottom: 0.35rem;
      background: var(--info-bg); color: var(--info);
    }
    .leg-detail { font-size: 0.72rem; opacity: 0.68; margin: 0.15rem 0 0.4rem; }

    .badges { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0 0.25rem; }
    .badge {
      font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
      padding: 0.15rem 0.5rem; border-radius: 3px;
    }
    .badge-best { background: var(--green); color: #f3ecd6; }
    .badge-direct { background: var(--good-bg); color: var(--good); }
    .badge-cheap { background: var(--warn-bg); color: var(--warn); }
    .badge-fast { background: var(--info-bg); color: var(--info); }
    .badge-plain { background: rgba(28,26,21,0.07); color: var(--ink); }
    .badge-eco { background: var(--good-bg); color: var(--good); }

    .warning { font-size: 0.72rem; color: var(--warn); margin-top: 0.2rem; }
    .warning::before { content: "⚠ "; }

    .card-action {
      display: inline-block; margin-top: 0.6rem;
      font-size: 0.7rem; font-weight: 600; padding: 0.48rem 1.1rem;
      border: 1px solid var(--brass); border-radius: 3px;
      background: transparent; color: var(--brass);
      cursor: pointer; letter-spacing: 0.14em; text-transform: uppercase;
      text-decoration: none; transition: background 0.15s, color 0.15s, box-shadow 0.15s;
      box-shadow: inset 0 0 0 2px var(--bg), inset 0 0 0 2.5px var(--brass-soft);
    }
    .card-action:hover { background: var(--brass); color: var(--bg); box-shadow: none; }

    .ret-picker { margin: 0.6rem 0 0.2rem; }
    .ret-picker-label {
      font-size: 0.68rem; letter-spacing: 0.02em; opacity: 0.7; margin-bottom: 0.35rem;
    }
    .ret-options { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .ret-opt {
      display: flex; flex-direction: column; gap: 0.1rem; text-align: left;
      border: 1px solid var(--line); border-radius: 6px; background: transparent;
      padding: 0.35rem 0.55rem; cursor: pointer; color: var(--ink);
      transition: border-color 0.15s, background 0.15s;
    }
    .ret-opt:hover { border-color: var(--brass); }
    .ret-opt.picked { border-color: var(--green); background: rgba(44, 70, 54, 0.08); }
    .ret-opt .t { font-size: 0.78rem; font-weight: 600; }
    .ret-opt .s { font-size: 0.64rem; opacity: 0.65; }
    .ret-opt .p { font-size: 0.66rem; font-weight: 600; color: var(--brass); }
    .ret-opt.picked .p { color: var(--green); }
    html.dark .ret-opt.picked { background: rgba(168, 210, 154, 0.10); border-color: #a8d29a; }
    html.dark .ret-opt.picked .p { color: #a8d29a; }
    .compact-ret { margin-top: 0.15rem; }
    .compact-ret .fselect { width: 100%; font-size: 0.64rem; }

    .stub-divider { position: relative; border-top: 1.5px dashed rgba(28,26,21,0.22); margin: 0.85rem -1.1rem 0.6rem; }
    .stub-divider::before, .stub-divider::after {
      content: ""; position: absolute; top: -0.55rem; width: 1.1rem; height: 1.1rem;
      border-radius: 50%; background: var(--bg); border: 1px solid var(--line);
    }
    .stub-divider::before { left: -0.65rem; border-left-color: transparent; }
    .stub-divider::after { right: -0.65rem; border-right-color: transparent; }

    .date-grid { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .date-cell {
      border: 1px solid var(--line); background: var(--panel); border-radius: 5px;
      padding: 0.5rem 0.75rem; cursor: pointer; text-align: left;
      transition: all 0.15s;
    }
    .date-cell:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(177,71,31,0.12); }
    .date-cell.cheapest { border-color: var(--good); background: var(--good-bg); }
    .date-cell .d { font-size: 0.72rem; display: block; opacity: 0.75; }
    .date-cell .p { font-size: 0.9rem; font-weight: 700; }
    .date-cell.cheapest .p { color: var(--good); }

    /* expanded flexible-date view: month calendars heatmapped by price */
    .cal-wrap { display: flex; flex-wrap: wrap; gap: 1.1rem 1.4rem; align-items: flex-start; }
    .cal-month { flex: 1 1 16rem; min-width: 15rem; max-width: 21rem; }
    .cal-title { font-family: var(--serif); font-weight: 600; font-size: 0.95rem; margin-bottom: 0.45rem; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .cal-wd {
      font-size: 0.56rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
      opacity: 0.55; text-align: center; padding-bottom: 2px;
    }
    .cal-cell {
      border: 1px solid transparent; border-radius: 5px; background: none;
      min-height: 2.6rem; padding: 0.22rem 0.1rem 0.28rem;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      font-variant-numeric: tabular-nums; transition: border-color 0.15s, box-shadow 0.15s;
    }
    .cal-cell .cal-day { font-size: 0.6rem; opacity: 0.6; line-height: 1; }
    .cal-cell .cal-price { font-size: 0.66rem; font-weight: 700; line-height: 1.1; }
    .cal-cell.pad { visibility: hidden; }
    .cal-cell.noprice .cal-day { opacity: 0.28; }
    .cal-cell.h0, .swatch.h0 { background: var(--heat0); }
    .cal-cell.h1, .swatch.h1 { background: var(--heat1); }
    .cal-cell.h2, .swatch.h2 { background: var(--heat2); }
    .cal-cell.h3, .swatch.h3 { background: var(--heat3); }
    .cal-cell.h4, .swatch.h4 { background: var(--heat4); }
    .cal-cell.priced { cursor: pointer; }
    .cal-cell.priced:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(177, 71, 31, 0.12); }
    .cal-cell.cheapest { border-color: var(--good); }
    .cal-cell.cheapest .cal-price { color: var(--good); }
    .cal-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 1.2rem; margin-top: 0.65rem; }
    .cal-legend { display: flex; align-items: center; gap: 4px; font-size: 0.62rem; opacity: 0.8; }
    .cal-legend .swatch { width: 1.15rem; height: 0.55rem; border-radius: 3px; border: 1px solid var(--line); }
    .cal-legend .lab { margin: 0 0.25rem; }
    .cal-note { font-size: 0.72rem; opacity: 0.65; }

    /* round-trip mix & match board (expanded itineraries view) */
    .rt-board { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; align-items: start; }
    @media (max-width: 880px) { .rt-board { grid-template-columns: 1fr; } }
    .rt-col-head { font-family: var(--serif); font-weight: 600; font-size: 0.95rem; margin-bottom: 0.45rem; }
    .rt-col-note { font-size: 0.68rem; opacity: 0.6; font-weight: 400; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .rt-rows { display: flex; flex-direction: column; gap: 0.35rem; max-height: 30rem; overflow-y: auto; padding-right: 2px; }
    .rt-row {
      text-align: left; border: 1px solid var(--line); background: var(--panel);
      border-radius: 7px; padding: 0.5rem 0.65rem; cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .rt-row:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(177, 71, 31, 0.12); }
    .rt-row.sel { border-color: var(--good); background: var(--good-bg); box-shadow: none; }
    .rt-row.unpriced { border-style: dashed; background: transparent; }
    .rt-row-main { display: flex; justify-content: space-between; gap: 0.5rem; align-items: baseline; }
    .rt-times { font-weight: 600; font-size: 0.86rem; }
    .rt-price { font-size: 0.86rem; font-weight: 700; color: var(--accent-dark); white-space: nowrap; }
    .rt-price .from { font-size: 0.62rem; font-weight: 500; opacity: 0.65; color: var(--ink); }
    .rt-row.sel .rt-price, .rt-row.sel .rt-price b { color: var(--good); }
    .rt-row-sub { font-size: 0.7rem; opacity: 0.72; margin-top: 0.15rem; }
    .rt-row-tags { display: flex; gap: 0.3rem; margin-top: 0.25rem; align-items: center; flex-wrap: wrap; }
    .rt-tag { font-size: 0.6rem; padding: 0.1rem 0.45rem; border-radius: 999px; background: var(--info-bg); color: var(--info); font-weight: 600; }
    .rt-tag.warn { background: var(--warn-bg); color: var(--warn); }
    .rt-empty { font-size: 0.78rem; opacity: 0.6; padding: 0.6rem 0.2rem; }
    /* share: quiet links on cards; an overlay with the rendered boarding pass */
    .share-quiet {
      background: none; border: none; cursor: pointer;
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--brass);
      padding: 0.48rem 0.4rem; margin-left: 0.55rem;
    }
    .share-quiet:hover { text-decoration: underline; }
    .share-overlay {
      position: fixed; inset: 0; z-index: 40; display: flex;
      align-items: center; justify-content: center; padding: 1.2rem;
      background: rgba(28, 26, 21, 0.45);
    }
    .share-panel {
      background: var(--panel); border: 1px solid var(--line-strong);
      border-radius: 12px; box-shadow: var(--card-shadow-hover);
      max-width: 46rem; width: 100%; padding: 1.1rem 1.2rem 1.2rem;
      max-height: calc(100vh - 2.4rem); overflow: auto;
    }
    .share-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.7rem; }
    .share-title { font-family: var(--serif); font-weight: 600; font-size: 1.05rem; }
    .share-close { background: none; border: none; cursor: pointer; font-size: 1rem; color: var(--ink); opacity: 0.6; }
    .share-close:hover { opacity: 1; }
    .share-preview { width: 100%; border-radius: 8px; display: block; box-shadow: 0 6px 18px -8px rgba(90, 70, 40, 0.4); }
    .share-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.85rem; align-items: center; }
    .share-toast { font-size: 0.75rem; color: var(--good); font-weight: 600; margin-left: auto; }

    /* streaming: a quiet caret while the recommendation types itself out,
       then the cards rise in after the prose lands */
    .msg-text.streaming::after {
      content: '▍'; margin-left: 1px; color: var(--accent);
      animation: caret-blink 0.9s steps(1) infinite;
    }
    @keyframes caret-blink { 50% { opacity: 0; } }
    .sec-appear { animation: sec-rise 0.32s ease both; }
    @keyframes sec-rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .sec-appear { animation: none; }
    }

    .rt-degraded {
      border: 1px dashed var(--line-strong); border-radius: 7px; padding: 0.8rem 0.9rem;
      font-size: 0.82rem; display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center;
    }
    .rt-unpriced-panel {
      border: 1px dashed var(--line-strong); border-radius: 7px; padding: 0.9rem;
      font-size: 0.82rem; display: flex; flex-direction: column; gap: 0.6rem; align-items: flex-start;
    }
    .rt-unpriced-inner { display: flex; flex-direction: column; gap: 0.6rem; align-items: flex-start; }
    .rt-dot { display: inline-block; vertical-align: middle; margin-right: 0.4rem; }
    .rt-more { margin-top: 0.15rem; }
    .rt-summary {
      display: flex; justify-content: space-between; align-items: center; gap: 0.9rem; flex-wrap: wrap;
      border: 1px solid var(--line-strong); background: var(--panel); border-radius: 8px;
      padding: 0.6rem 0.9rem; margin-top: 0.75rem;
      position: sticky; bottom: calc(5.6rem + env(safe-area-inset-bottom));
      box-shadow: var(--card-shadow); z-index: 3;
    }
    .rt-summary-legs { font-size: 0.78rem; }
    .rt-summary-price { font-family: var(--serif); font-weight: 600; font-size: 1.05rem; color: var(--accent-dark); }
    .rt-summary .card-action { margin-top: 0; }
    html.dark .rt-row.sel { background: rgba(168, 210, 154, 0.10); }
    html.dark .rt-price, html.dark .rt-summary-price { color: #e08a5a; }
    html.dark .rt-row.sel .rt-price, html.dark .rt-row.sel .rt-price b { color: #a8d29a; }

    .input-area {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 7;
      background-color: var(--bg);
      background-image: var(--paper);
      background-attachment: fixed;   /* aligns the texture with the page behind */
      padding: 0.8rem 0 calc(0.8rem + env(safe-area-inset-bottom));
      border-top: 1px solid transparent;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    /* only when something is genuinely hidden behind the bar does a divider
       earn its place; on a short page it was drawing a line and an upward
       shadow smudge across empty paper */
    .input-area.raised {
      border-top-color: var(--line);
      box-shadow: 0 -8px 20px -14px rgba(28, 26, 21, 0.35);
    }
    html.dark .input-area.raised { box-shadow: 0 -8px 20px -14px rgba(0, 0, 0, 0.7); }
    .input-inner { max-width: 58rem; margin: 0 auto; padding: 0 1.5rem; }
    .new-below {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(5.9rem + env(safe-area-inset-bottom)); z-index: 8;
      font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 0.5rem 1rem; border: none; border-radius: 999px;
      background: var(--green); color: #f3ecd6; cursor: pointer;
      box-shadow: 0 4px 14px rgba(28, 26, 21, 0.25);
      animation: rise 0.25s ease both;
    }
    .input-row { display: flex; gap: 0.75rem; align-items: flex-end; }
    .text-input {
      flex: 1; font-size: 0.9rem; line-height: 1.5;
      border: 1px solid var(--line); border-radius: 8px;
      outline: none; padding: 0.65rem 0.9rem;
      background: var(--panel); color: var(--ink);
      resize: none; overflow-y: auto; max-height: 10rem; min-height: 2.9rem;
      transition: border-color 0.15s;
    }
    .text-input:focus { border-color: var(--accent); }
    .text-input::placeholder { color: rgba(28,26,21,0.40); }
    .submit-btn {
      font-size: 0.75rem; font-weight: 600; padding: 0.8rem 1.5rem;
      border: none; border-radius: 8px;
      background: var(--accent); color: #fff;
      cursor: pointer; letter-spacing: 0.08em; text-transform: uppercase;
      transition: background 0.15s;
    }
    .submit-btn:hover:not(:disabled) { background: var(--accent-dark); }
    .submit-btn:disabled { opacity: 0.35; cursor: default; }

    .loading { display: flex; align-items: center; gap: 0.6rem; font-size: 0.95rem; opacity: 0.8; font-family: var(--serif); font-style: italic; }
    .stop-btn {
      font-size: 0.68rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
      padding: 0.3rem 0.7rem; margin-left: 0.35rem;
      border: 1px solid var(--line); border-radius: 999px;
      background: transparent; color: var(--ink); cursor: pointer;
      transition: all 0.15s;
    }
    .stop-btn:hover { border-color: var(--accent); color: var(--accent-dark); }
    .msg-note { font-size: 0.8rem; opacity: 0.60; font-style: italic; }
    .loading-dot {
      width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--brass);
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.1); } }

    .ladder {
      position: fixed; top: 7rem; right: 1rem; width: 12rem; z-index: 5;
      max-height: calc(100vh - 10rem); overflow-y: auto;
      border-left: 1px solid var(--brass-soft); padding-left: 0.7rem;
    }
    .ladder-title {
      font-size: 0.58rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--brass); margin-bottom: 0.5rem;
    }
    .ladder-item {
      display: block; width: 100%; text-align: left; background: none; border: none;
      font-size: 0.62rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
      color: var(--ink); opacity: 0.55; cursor: pointer; padding: 0.22rem 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: opacity 0.15s, color 0.15s;
    }
    .ladder-item:hover { opacity: 1; color: var(--accent-dark); }
    .ladder-item .n { color: var(--brass); margin-right: 0.35rem; }
    .ladder-fab {
      position: fixed; right: 1rem; bottom: calc(5.9rem + env(safe-area-inset-bottom)); z-index: 6; display: none;
      font-size: 0.62rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
      padding: 0.55rem 0.9rem; border-radius: 999px; border: 1px solid var(--brass);
      background: var(--bg); color: var(--brass); cursor: pointer;
      box-shadow: 0 2px 10px rgba(28,26,21,0.18);
    }
    @media (max-width: 1400px) {
      .ladder { display: none; }
      .ladder.overlay {
        display: block; top: auto; bottom: calc(9rem + env(safe-area-inset-bottom)); right: 1rem;
        background: var(--bg); border: 1px solid var(--brass-soft);
        border-radius: 8px; padding: 0.8rem 0.9rem; width: 14rem; max-height: 50vh;
        box-shadow: 0 6px 24px rgba(28,26,21,0.18);
      }
      .ladder-fab { display: block; }
    }

    .footer { text-align: center; margin-top: 3.5rem; font-size: 0.72rem; }
    .footer .flourish { color: var(--brass); letter-spacing: 0.35em; font-size: 0.6rem; margin-bottom: 0.4rem; }
    .footer a { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; opacity: 0.6; }

    /* Midnight concierge: same stationery, lights down. The route maps keep
       their cream palette on purpose — they read as atlas plates on a dark desk.
       Applied via html.dark (set by the head script): follows the system unless
       the header theme button pins light or dark in localStorage. */
    html.dark {
      color-scheme: dark;
      --bg: #1b1f1a;
      --ink: #ece4cb;
      --line: rgba(236, 228, 203, 0.14);
      --line-strong: rgba(236, 228, 203, 0.32);
      --rule-strong: rgba(236, 228, 203, 0.30);
      --rule-soft: rgba(236, 228, 203, 0.14);
      --panel: #242921;
      --good: #a8d29a;
      --good-bg: rgba(168, 210, 154, 0.13);
      --info: #9ecbdc;
      --info-bg: rgba(158, 203, 220, 0.13);
      --warn: #e0b070;
      --warn-bg: rgba(224, 176, 112, 0.13);
      --brass: #c9a55a;
      --brass-soft: rgba(201, 165, 90, 0.45);
      --green: #3a5747;
      --heat0: rgba(168, 210, 154, 0.26);
      --heat1: rgba(168, 210, 154, 0.13);
      --heat2: rgba(236, 228, 203, 0.05);
      --heat3: rgba(217, 122, 74, 0.14);
      --heat4: rgba(217, 122, 74, 0.26);
      --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 10px 26px -14px rgba(0, 0, 0, 0.6);
      --card-shadow-hover: 0 2px 4px rgba(0, 0, 0, 0.3), 0 16px 34px -14px rgba(0, 0, 0, 0.7);
      --paper: radial-gradient(circle at 85% -10%, rgba(217, 122, 74, 0.10), transparent 45%);
    }
    html.dark body {
      background-image: var(--paper);
    }
    html.dark .header h1 em { color: #d97a4a; }
    html.dark .card-price, html.dark .compact-price, html.dark .hero .hello,
    html.dark .route-stop-label, html.dark .compact-book,
    html.dark .chip:hover, html.dark .ladder-item:hover { color: #e08a5a; }
    html.dark .section-label { color: #d9995f; }
    html.dark .msg-user { color: #f3ecd6; }
    html.dark .msg-text { border-left-color: #d97a4a; }
    html.dark .badge-plain { background: rgba(236, 228, 203, 0.10); color: var(--ink); }
    html.dark .text-input::placeholder { color: rgba(236, 228, 203, 0.38); }
    html.dark .route-map { box-shadow: 0 2px 12px rgba(0, 0, 0, 0.35); }

  </style>
</head>
<body>
  <div class="container" x-data="flightApp()">
    <div class="header">
      <div class="masthead">
        <div class="crest">✈</div>
        <div>
          <h1>Flight <em>Assistant</em></h1>
          <p>Claude · Live Google Flights Data</p>
        </div>
      </div>
      <div class="header-tools">
        <button class="theme-btn" @click="cycleTheme()" :title="themeTitle()" aria-label="Color theme" x-text="themeIcon()"></button>
        <div class="view-toggle">
          <button :class="viewMode === 'detailed' ? 'active' : ''" @click="setView('detailed')">Detailed</button>
          <button :class="viewMode === 'compact' ? 'active' : ''" @click="setView('compact')">Compact</button>
        </div>
      </div>
    </div>

    <template x-if="!hasSearched">
      <div>
        <div class="hero">
          <div class="date" x-text="longToday()"></div>
          <div class="hello" x-text="greeting()"></div>
          <div class="ask">Where shall we take you? Describe the trip and I'll handle the searching.</div>
        </div>
        <div class="capabilities">
          <div class="cap">
            <div class="cap-title"><span>1</span>Talk like a person, not a form</div>
            <div class="cap-body">Describe the trip the way you'd tell a friend — vague dates ("mid-October", "back by Friday"), cities instead of airport codes, budgets, loyalty status, "no budget airlines". The more intent you give, the better the recommendation.</div>
          </div>
          <div class="cap">
            <div class="cap-title"><span>2</span>Make it do the comparing</div>
            <div class="cap-body">Ask A-vs-B questions: two dates, two routings, an overnight stopover vs the direct. It runs the searches side by side with real total prices — round trips and multi-city are priced as one ticket.</div>
          </div>
          <div class="cap">
            <div class="cap-title"><span>3</span>Push back and iterate</div>
            <div class="cap-body">Results are a conversation. Tap a suggested follow-up or type your own — "only nonstops", "is Saturday cheaper?", "what about Newark?" You can stop a search mid-way to correct it, and flip any result block to Compact for side-by-side scanning.</div>
          </div>
        </div>
      </div>
    </template>

    <div class="messages">
      <template x-for="(msg, i) in messages" :key="i">
        <div :id="'msg-' + i" style="display:flex; flex-direction:column;">
          <div x-show="msg.role === 'user'" class="msg-user" x-text="msg.content"></div>
          <div x-show="msg.role === 'note'" class="msg-note" x-text="msg.content"></div>

          <div x-show="msg.role === 'assistant'" class="msg-assistant">
            <div class="msg-text" :class="msg._streaming ? 'streaming' : ''"
                 x-show="msg.content || !msg._streaming" x-html="renderText(msg.content)"></div>

            <template x-for="(sec, si) in visibleSections(msg)" :key="sec._anchor || si">
              <div :id="sec._anchor" class="sec-appear" :style="'animation-delay:' + (si * 70) + 'ms'">
                <div class="section-head">
                  <div class="section-label" x-text="sectionLabel(sec)"></div>
                  <div class="mini-toggle" x-show="sec.results && sec.results.length && !(sec.type === 'itineraries' && sec._expanded)">
                    <button :class="sectionView(sec) === 'detailed' ? 'active' : ''" @click="sec._view = 'detailed'">Detail</button>
                    <button :class="sectionView(sec) === 'compact' ? 'active' : ''" @click="sec._view = 'compact'">Compact</button>
                  </div>
                </div>

                <div class="filter-bar" x-show="sec._expanded && sec.type !== 'dates'">
                  <select class="fselect" :value="(sec._filters || {}).sort || ''" @change="setF(sec, 'sort', $event.target.value)">
                    <option value="">Sort: best value</option>
                    <option value="price">Sort: price</option>
                    <option value="duration">Sort: duration</option>
                    <option value="departure">Sort: departure</option>
                  </select>
                  <select class="fselect" :value="(sec._filters || {}).dep || ''" @change="setF(sec, 'dep', $event.target.value)">
                    <option value="">Depart: any time</option>
                    <option value="early">Before 8am</option>
                    <option value="morning">8am – 12pm</option>
                    <option value="afternoon">12pm – 6pm</option>
                    <option value="evening">After 6pm</option>
                  </select>
                  <select class="fselect" :value="(sec._filters || {}).maxDur || ''" @change="setF(sec, 'maxDur', $event.target.value)">
                    <option value="">Duration: any</option>
                    <template x-for="h in durationOptions(sec)" :key="h">
                      <option :value="h" x-text="'Under ' + h + 'h'" :selected="String((sec._filters || {}).maxDur) === String(h)"></option>
                    </template>
                  </select>
                  <select class="fselect" :value="(sec._filters || {}).airline || ''" @change="setF(sec, 'airline', $event.target.value)">
                    <option value="">Airline: any</option>
                    <template x-for="a in airlineOptions(sec)" :key="a.code">
                      <option :value="a.code" x-text="a.name" :selected="(sec._filters || {}).airline === a.code"></option>
                    </template>
                  </select>
                  <select class="fselect" x-show="allianceOptions(sec).length" :value="(sec._filters || {}).alliance || ''" @change="setF(sec, 'alliance', $event.target.value)">
                    <option value="">Alliance: any</option>
                    <template x-for="al in allianceOptions(sec)" :key="al">
                      <option :value="al" x-text="al" :selected="(sec._filters || {}).alliance === al"></option>
                    </template>
                  </select>
                  <select class="fselect" :value="(sec._filters || {}).stops ?? ''" @change="setF(sec, 'stops', $event.target.value)">
                    <option value="">Stops: any</option>
                    <option value="0">Nonstop only</option>
                    <option value="1">1 stop max</option>
                  </select>
                  <span class="fcount" x-text="sec.type === 'itineraries'
                    ? rtOutbounds(sec).length + ' of ' + rtAll(sec).length + ' outbounds'
                    : list(sec).length + ' of ' + (sec.results || []).length + ' options'"></span>
                </div>

                <!-- one-way flights, compact -->
                <template x-if="sec.type === 'flights' && sec.results && sec.results.length && sectionView(sec) === 'compact'">
                  <div class="compact-grid">
                    <template x-for="(f, j) in visible(sec, 8)" :key="j">
                      <div class="compact-card">
                        <div class="compact-top">
                          <div class="compact-airline" x-text="f.airline"></div>
                          <div class="compact-price" x-text="formatPrice(f.price, f.currency)"></div>
                        </div>
                        <div class="compact-times" x-text="formatTime(f.legs[0].departure) + ' → ' + formatTime(f.legs[f.legs.length-1].arrival) + arrivalDay(f)"></div>
                        <div class="compact-sub" x-text="f.legs[0].from + '–' + f.legs[f.legs.length-1].to + ' · ' + formatDuration(f.duration) + ' · ' + stopsText(f.stops) + ((f.layovers || []).length ? ' via ' + f.layovers.map(l => l.airport).join(', ') : '')"></div>
                        <div class="compact-badges" x-show="(f.highlights || []).length">
                          <template x-for="(h, k) in f.highlights" :key="k"><span class="badge" :class="badgeClass(h)" x-text="h"></span></template>
                        </div>
                        <div class="compact-warn" x-show="(f.warnings || []).length" x-text="'⚠ ' + (f.warnings || []).length + ' caveat' + (f.warnings.length > 1 ? 's' : '') + ' — see Detailed'"></div>
                        <a :href="f.booking_url" target="_blank" rel="noopener noreferrer" class="compact-book">Book →</a><button class="share-quiet" @click="shareFlight(f)">Share</button>
                      </div>
                    </template>
                  </div>
                </template>

                <!-- one-way flights, detailed -->
                <template x-if="sec.type === 'flights' && sec.results && sec.results.length && sectionView(sec) === 'detailed'">
                  <div class="flight-list">
                    <template x-for="(f, j) in visible(sec, 5)" :key="j">
                      <div class="flight-card">
                        <div class="card-header">
                          <div class="airline-id">
                            <div class="airline-avatar" :style="'background:' + airlineColor(f.airline_code)" x-text="f.airline_code"></div>
                            <div>
                              <div class="card-airline" x-text="f.airline"></div>
                              <div class="card-code" x-text="flightCodes(f)"></div>
                            </div>
                          </div>
                          <div>
                            <div class="card-price" x-text="formatPrice(f.price, f.currency)"></div>
                            <div class="card-price-note">one-way, per person</div>
                          </div>
                        </div>
                        <div class="route">
                          <div class="route-end">
                            <div class="route-time" x-text="formatTime(f.legs[0].departure)"></div>
                            <div class="route-port" x-text="f.legs[0].from"></div>
                          </div>
                          <div class="route-mid">
                            <div class="route-line"></div>
                            <template x-for="(s, si) in stopPositions(f)" :key="'st'+si">
                              <div class="route-stop" :style="'left:' + s.pct + '%'"><span class="route-stop-label" x-text="s.code"></span></div>
                            </template>
                            <div class="route-meta" x-text="formatDate((f.legs[0].departure || '').slice(0, 10)) + ' · ' + formatDuration(f.duration) + ' · ' + stopsText(f.stops)"></div>
                          </div>
                          <div class="route-end">
                            <div class="route-time" x-text="formatTime(f.legs[f.legs.length-1].arrival)"></div>
                            <div class="route-port" x-text="f.legs[f.legs.length-1].to + arrivalDay(f)"></div>
                          </div>
                        </div>
                        <template x-for="(lo, k) in (f.layovers || [])" :key="k">
                          <div class="leg-detail" x-text="layoverText(lo)"></div>
                        </template>
                        <div class="leg-detail" x-show="aircraftText(f)" x-text="aircraftText(f)"></div>
                        <div class="leg-detail" x-show="operatedBy(f)" x-text="operatedBy(f)"></div>
                        <div class="route-map" x-show="(f.route_points || []).length > 1" x-html="mapSvg(f.route_points)"></div>
                        <div class="badges" x-show="(f.highlights || []).length || ecoBadge(f)">
                          <template x-for="(h, k) in f.highlights" :key="k">
