          // the model sometimes hard-wraps mid-sentence; join single newlines
          // into flowing text but keep paragraph breaks and list lines.
          // The join has to CONSUME the whitespace on BOTH sides of the
          // break, not swap the newline for a space: a wrap landing before
          // a comma rendered as "on Nov 28 , with morning departures", and
          // one landing after a trailing space gave "rises to  $374".
          const PARA = '\u0001', LIST = '\u0002';
          const flowed = esc
            .replace(/\n{2,}/g, PARA)
            .replace(/\n(?=\s*(?:[-*\u2022]|\d+[.)])\s)/g, LIST)
            .replace(/[ \t]*\n[ \t]*/g, ' ')
            .replace(/[ \t]{2,}/g, ' ')
            .replace(/ +([,.;:!?%)\]])/g, '$1')
            .replace(/([($\[]) +/g, '$1')
            .replace(/ +([\u0001\u0002])/g, '$1')
            .replace(/(\u0001) +/g, '$1')
            .replace(/\u0001/g, '\n\n')
            .replace(/\u0002/g, '\n');
          return flowed.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        },

        // ---- trip briefings: watch a search, email it on a schedule ----
        canWatch(sec) {
          return !!this.ownerKey && !!sec.watch_spec && !!((sec.results || []).length || (sec.dates || []).length
            || (sec.more_outbounds || []).length || this.mcHasLegs(sec));
        },
        openWatch(sec, i) {
          const prev = this.messages[i - 1];
          let saved = [];
          try { saved = JSON.parse(localStorage.getItem('fa_watch_recipients') || '[]') || []; } catch (e) { }
          this.watch = { open: true, spec: sec.watch_spec, title: sec.title || this.sectionLabel(sec),
                         subtitle: sec.subtitle || '', query: (prev && prev.role === 'user') ? prev.content : '',
                         recipients: saved, input: '', freq: 1, threshold: '', key: '', busy: false, err: '', done: '' };
          this.$nextTick(() => this.$refs.rcpt && this.$refs.rcpt.focus());
        },
        addRecipient() {
          const parts = (this.watch.input || '').split(/[\s,;]+/).map(x => x.trim().toLowerCase()).filter(Boolean);
          for (const e of parts) {
            if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(e)) { this.watch.err = "That doesn't look like an email: " + e; return; }
            if (!this.watch.recipients.includes(e)) this.watch.recipients.push(e);
          }
          this.watch.input = ''; this.watch.err = '';
        },
        removeRecipient(e) { this.watch.recipients = this.watch.recipients.filter(x => x !== e); },
        async _ownerFetch(url, body, key) {
          const res = await fetch(url, {
            method: body === undefined ? 'GET' : 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Owner-Key': key || this.ownerKey },
            body: body === undefined ? undefined : JSON.stringify(body),
          });
          const data = await res.json().catch(() => ({}));
          if (res.status === 401) {
            this.ownerKey = '';
            try { localStorage.removeItem('fa_owner_key'); } catch (e) { }
          }
          if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
          return data;
        },
        async startWatch() {
          this.addRecipient();
          if (this.watch.err) return;
          if (!this.watch.recipients.length) { this.watch.err = 'Add at least one email address.'; return; }
          const key = this.ownerKey || (this.watch.key || '').trim();
          if (!key) { this.watch.err = 'Enter your site key.'; return; }
          this.watch.busy = true; this.watch.err = '';
          try {
            const data = await this._ownerFetch('/api/watches', {
              spec: this.watch.spec, query: this.watch.query, recipients: this.watch.recipients,
              frequency_days: this.watch.freq, threshold: this.watch.threshold || null }, key);
            this.ownerKey = key;
            try {
              localStorage.setItem('fa_owner_key', key);
              localStorage.setItem('fa_watch_recipients', JSON.stringify(this.watch.recipients));
            } catch (e) { }
            const sent = (data.first || {}).sent || [];
            const every = { 1: 'every day', 3: 'every 3 days', 7: 'every week' }[this.watch.freq];
            this.watch.done = sent.length
              ? `Watching. The first briefing just went to ${sent.length === 1 ? sent[0] : sent.length + ' people'}; the next arrives ${every}.`
              : `Watching. The first check found no fares to send yet; it will try again ${every}.`;
          } catch (e) {
            this.watch.err = e.message;
          } finally {
            this.watch.busy = false;
          }
        },
        async openBriefings(key) {
          const k = key || this.ownerKey;
          this.briefings = { open: true, list: [], busy: !!k, err: '', key: '' };
          if (!k) return;  // the panel asks for the key first
          try {
            this.briefings.list = (await this._ownerFetch('/api/watches', undefined, k)).watches || [];
            if (!this.ownerKey) {
              this.ownerKey = k;
              try { localStorage.setItem('fa_owner_key', k); } catch (e) { }
            }
          } catch (e) {
            this.briefings.err = e.message;
          } finally {
            this.briefings.busy = false;
          }
        },
        briefingMeta(w) {
          const every = { 1: 'Daily', 3: 'Every 3 days', 7: 'Weekly' }[w.frequency_days] || 'Scheduled';
          const live = (w.recipients || []).filter(r => r.active).length;
          const bits = [w.active ? every : 'Paused', live + (live === 1 ? ' recipient' : ' recipients'),
                        w.checks + (w.checks === 1 ? ' check' : ' checks')];
          if (w.threshold) bits.push('emails on moves of $' + Math.round(w.threshold) + '+');
          if (w.last_sent) bits.push('last sent ' + this.agoText(w.last_sent * 1000));
          return bits.join(' · ');
        },
        editRecipients(w, op, email) {
          const cur = w._edit || (w.recipients || []).map(r => r.email);
          const e = (email || '').trim().toLowerCase();
          if (op === 'add' && e && !cur.includes(e)) w._edit = [...cur, e];
          if (op === 'remove') w._edit = cur.filter(x => x !== e);
        },
        async briefingAction(w, action) {
          w._busy = action;
          try {
            if (action === 'delete') {
              if (!confirm('Stop "' + w.title + '" for everyone on it?')) return;
              await this._ownerFetch('/api/watches/' + w.id + '/delete', {});
              this.briefings.list = this.briefings.list.filter(x => x.id !== w.id);
              return;
            }
            const data = action === 'send'
              ? await this._ownerFetch('/api/watches/' + w.id + '/send', {})
              : await this._ownerFetch('/api/watches/' + w.id + '/update',
                  action === 'recipients' ? { recipients: w._edit } : { active: action === 'resume' });
            const i = this.briefings.list.findIndex(x => x.id === w.id);
            if (i >= 0) this.briefings.list[i] = data.watch;
          } catch (e) {
            w.last_error = e.message;
          } finally {
            w._busy = false;
          }
        },

        // examples fill the box rather than sending: a starting point to edit
        useExample(text) {
          this.input = text;
          this.$nextTick(() => { this.autosize(); this.$refs.box && this.$refs.box.focus(); });
        },

        greeting() {
          const h = new Date().getHours();
          return h < 5 ? 'Burning the midnight oil.' : h < 12 ? 'Good morning.' : h < 18 ? 'Good afternoon.' : 'Good evening.';
        },

        longToday() {
          return new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
        },

        cleanAircraft(name) {
          // Google sends e.g. "Boeing 737MAX 8 Passenger"; show "Boeing 737 MAX 8".
          // Variants (777-300ER, A330-900neo) appear whenever Google includes them.
          return (name || '')
            .replace(/\s*(Passenger|Freighter|Cargo)\s*$/i, '')
            .replace(/(\d)\s*MAX\s*(\d)/i, '$1 MAX $2')
            .trim();
        },

        aircraftText(f) {
          const legs = f.legs || [];
          return [...new Set(legs.map(l => this.cleanAircraft(l.aircraft)).filter(Boolean))].join(' + ');
        },

        operatedBy(f) {
          const ops = [...new Set((f.legs || []).map(l => l.operated_by).filter(o => o && o !== f.airline))];
          return ops.length ? 'Operated by ' + ops.join(', ') : '';
        },

        ecoBadge(f) {
          const d = f.co2_delta_pct;
          return (d != null && d <= -5) ? Math.round(Math.abs(d)) + '% less CO₂' : '';
        },

        mapSvg(points, returnPoints) {
          const norm = arr => (arr || []).filter(p => p && p.lat != null);
          const pts1 = norm(points), pts2 = norm(returnPoints);
          if (pts1.length < 2) return '';
          // equirectangular, same frame as WORLD_PATH: x = lon+180, y = 90-lat.
          // Longitudes unwrap SEQUENTIALLY so every leg takes the short way
          // around the globe (a global shift breaks multi-leg routes whose
          // total span exceeds 180 degrees, e.g. FLL-BOS-CDG-PVG).
          const unwrapSeq = (pts, anchorX) => {
            const out = [];
            let prev = anchorX;
            for (const p of pts) {
              let x = p.lon + 180;
              if (prev != null) {
                while (x - prev > 180) x -= 360;
                while (prev - x > 180) x += 360;
              }
              out.push({ x, y: 90 - p.lat, code: p.code, layover: p.layover_min });
              prev = x;
            }
            return out;
          };
          const P = unwrapSeq(pts1, null);
          const R = unwrapSeq(pts2, P.length ? P[P.length - 1].x : null);
          const allP = [...P, ...R];
          const xs = allP.map(p => p.x), ys = allP.map(p => p.y);

          let minX = Math.min(...xs), maxX = Math.max(...xs);
          let minY = Math.min(...ys), maxY = Math.max(...ys);
          // padding is capped so long-haul routes stay framed on the route,
          // not zoomed out to the whole planet
          const padX = Math.min(Math.max((maxX - minX) * 0.35, 6), 16);
          const padY = Math.min(Math.max((maxY - minY) * 0.5, 5), 12);
          minX -= padX; maxX += padX; minY -= padY; maxY += padY;
          // widen to a pleasant aspect ratio (~3:1)
          const w = maxX - minX, h = maxY - minY;
          if (w / h < 2.6) { const extra = (h * 2.6 - w) / 2; minX -= extra; maxX += extra; }
          else if (w / h > 4.5) { const extra = (w / 4.5 - h) / 2; minY -= extra; maxY += extra; }

          const vb = `${minX.toFixed(1)} ${minY.toFixed(1)} ${(maxX - minX).toFixed(1)} ${(maxY - minY).toFixed(1)}`;
          const sw = (maxX - minX) / 300; // stroke scale
          const arc = (a, b, lift) => {
            const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
            const dx = b.x - a.x, dy = b.y - a.y;
            const len = Math.hypot(dx, dy) || 1;
            const k = lift * Math.min(len * 0.18, 6);
            return `M${a.x} ${a.y} Q${mx - dy / len * k} ${my - dx / len * -k} ${b.x} ${b.y}`;
          };
          let route = '';
          // colours come from the stylesheet (.route-map .m-*), so maps follow the theme
          for (let i = 0; i < P.length - 1; i++) route += `<path class="m-route" d="${arc(P[i], P[i+1], 1)}" stroke-width="${sw * 2}"/>`;
          // return legs: dashed, bowed the opposite way so both directions read
          for (let i = 0; i < R.length - 1; i++) route += `<path class="m-return" d="${arc(R[i], R[i+1], -1)}" stroke-width="${sw * 1.8}" stroke-dasharray="${sw * 3.5} ${sw * 2.5}"/>`;

          const fmtLay = m => m >= 60 ? Math.floor(m / 60) + 'h' + (m % 60 ? String(m % 60).padStart(2, '0') : '') : m + 'm';
          const seen = new Set();
          const endpoints = new Set([P[0]?.code, P[P.length - 1]?.code, R[0]?.code, R[R.length - 1]?.code]);
          const dots = allP.filter(p => !seen.has(p.code) && seen.add(p.code)).map(p => {
            const end = endpoints.has(p.code);
            const nearTop = p.y < minY + (maxY - minY) * 0.24;
            const labelY = nearTop ? p.y + sw * 12 : p.y - sw * 5;
            let t = `<circle class="${end ? 'm-node' : 'm-stop'}" cx="${p.x}" cy="${p.y}" r="${sw * (end ? 3.2 : 2.2)}"/>` +
                    `<text class="m-label" x="${p.x}" y="${labelY}" font-size="${sw * 9}" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600">${p.code}</text>`;
            if (!end && p.layover) {
              const layY = nearTop ? labelY + sw * 9.5 : p.y + sw * 10;
              t += `<text class="m-lay" x="${p.x}" y="${layY}" font-size="${sw * 7}" text-anchor="middle" font-family="Inter, sans-serif" font-weight="500">${fmtLay(p.layover)}</text>`;
            }
            return t;
          }).join('');

          // land + lakes drawn across three 360-degree spans so no edge of the
          // crop ever runs out of world; lakes punch through in the ocean color
          let ground = '';
          for (const dx of [-720, -360, 0, 360, 720]) {
            const t = dx ? ` transform="translate(${dx},0)"` : '';
            ground += `<use class="m-land" href="#worldpath"${t} stroke-width="${sw * 0.6}"/>`;
            ground += `<use class="m-lake" href="#lakespath"${t} stroke-width="${sw * 0.4}"/>`;
          }
          // ocean + graticule must extend well past the viewBox: with
          // preserveAspectRatio="meet" the letterbox margins show extra world
          const exW = (maxX - minX) * 1.6, exH = (maxY - minY) * 1.6;
          const eMinX = minX - exW, eMaxX = maxX + exW;
          const eMinY = minY - exH, eMaxY = maxY + exH;

          // faint graticule every 20 degrees for the atlas feel
          let grid = '';
          for (let gx = Math.ceil(eMinX / 20) * 20; gx <= eMaxX; gx += 20)
            grid += `<line x1="${gx}" y1="${eMinY.toFixed(1)}" x2="${gx}" y2="${eMaxY.toFixed(1)}"/>`;
          for (let gy = Math.max(0, Math.ceil(eMinY / 20) * 20); gy <= Math.min(180, eMaxY); gy += 20)
            grid += `<line x1="${eMinX.toFixed(1)}" y1="${gy}" x2="${eMaxX.toFixed(1)}" y2="${gy}"/>`;
          grid = `<g class="m-grid" stroke-width="${sw * 0.5}">${grid}</g>`;

          return `<svg viewBox="${vb}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">` +
            `<rect class="m-ocean" x="${eMinX.toFixed(1)}" y="${eMinY.toFixed(1)}" width="${(eMaxX - eMinX).toFixed(1)}" height="${(eMaxY - eMinY).toFixed(1)}"/>` +
            ground + grid + route + dots + `</svg>`;
        },

        airlineColor(code) {
          // monochrome marks: colored chips read app-y; ink reads engraved
          return 'transparent';
        },

        // Round trips are chosen the way Google does it: the card is an
        // OUTBOUND priced at the best total it can reach, and picking a return
        // swaps the leg in place so the total moves with the choice.
        isPickedReturn(it, ri) {
          const opts = it.return_options || [];
          const cur = it.return;
          return opts[ri] && cur && opts[ri].legs[0].departure === cur.legs[0].departure
            && opts[ri].legs[0].flight_number === cur.legs[0].flight_number;
        },

        // ---- round-trip mix & match board ----
        // rows are either priced groups (sec.results members, mutated in
        // place so the top-pick cards stay in sync) or thin wrappers around
        // more_outbounds flights; wrappers are rebuilt per render, so
        // selection is tracked by key, never by object identity
        rtKey(row) {
          const legs = (row.outbound || {}).legs || [];
          return (legs[0] ? legs[0].departure : '') + '|' + legs.map(l => l.airline_code + l.flight_number).join(',');
        },

        rtAll(sec) {
          const fetched = sec._fetched || {};
          const more = (sec.more_outbounds || []).map(x => {
            const w = { outbound: x, unpriced: true, from_total: x.from_total, currency: x.currency };
            // a row priced on demand via /api/returns graduates to a full group
            return fetched[this.rtKey(w)] || w;
          });
          return (sec.results || []).concat(more);
        },

        _rowPass(f, flt) {
          if (flt.dep) {
            const h = f.legs && f.legs[0].departure ? parseInt(f.legs[0].departure.slice(11, 13), 10) : 0;
            const ok = flt.dep === 'early' ? h < 8 : flt.dep === 'morning' ? (h >= 8 && h < 12)
              : flt.dep === 'afternoon' ? (h >= 12 && h < 18) : h >= 18;
            if (!ok) return false;
          }
          if (flt.maxDur && (f.duration ?? 1e9) > flt.maxDur * 60) return false;
          if (flt.airline && !(f.legs || []).some(l => l.airline_code === flt.airline)) return false;
          if (flt.alliance && f.alliance !== flt.alliance) return false;
          if (flt.stops !== '' && flt.stops != null && (f.stops ?? 9) > +flt.stops) return false;
          return true;
        },

        rtOutbounds(sec) {
          const flt = sec._filters || {};
          let rows = this.rtAll(sec).filter(g => this._rowPass(g.outbound, flt));
          const price = g => (g.unpriced ? g.from_total : (g.cheapest_total ?? g.total_price)) ?? 1e9;
          if (flt.sort === 'price') rows = [...rows].sort((a, b) => price(a) - price(b));
          else if (flt.sort === 'duration') rows = [...rows].sort((a, b) => (a.outbound.duration ?? 1e9) - (b.outbound.duration ?? 1e9));
          else if (flt.sort === 'departure') rows = [...rows].sort((a, b) => (a.outbound.legs[0].departure || '').localeCompare(b.outbound.legs[0].departure || ''));
          return rows;
        },

        rtSelected(sec) {
          const rows = this.rtOutbounds(sec);
          return rows.find(g => this.rtKey(g) === sec._selKey) || rows[0] || null;
        },

        rtIsSel(sec, g) {
          const s = this.rtSelected(sec);
          return !!s && this.rtKey(s) === this.rtKey(g);
        },

        rtSelect(sec, g) {
          sec._selKey = this.rtKey(g);
          // tapping a from-priced row IS the request to price it
          if (g.unpriced && sec.spec_echo && !(sec._fetched || {})[sec._selKey]
              && !(sec._fetching || {})[sec._selKey] && !(sec._fetchErr || {})[sec._selKey]) {
            this.rtFetchReturns(sec, g);
          }
        },

        rtFetchState(sec) {
          const g = this.rtSelected(sec);
          if (!g) return 'idle';
          const key = this.rtKey(g);
          return (sec._fetching || {})[key] ? 'loading'
            : (sec._fetchErr || {})[key] ? 'error' : 'idle';
        },

        rtPrice(sec) {
          const g = this.rtSelected(sec);
          if (!g) return;
          if (sec.spec_echo) this.rtFetchReturns(sec, g);
          else this.rtAskReturns(sec);   // sections from before spec_echo shipped
        },

        async rtFetchReturns(sec, g) {
          const key = this.rtKey(g);
          if ((sec._fetching || {})[key]) return;
          sec._fetching = { ...(sec._fetching || {}), [key]: true };
          const err = { ...(sec._fetchErr || {}) }; delete err[key]; sec._fetchErr = err;
          try {
            const resp = await fetch('/api/returns', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                spec: sec.spec_echo,
                from_total: g.unpriced ? g.from_total : g.cheapest_total,
                outbound: { legs: (g.outbound.legs || []).map(l => ({
                  airline_code: l.airline_code, flight_number: l.flight_number,
                  departure: l.departure, arrival: l.arrival, from: l.from, to: l.to })) },
              }),
            });
            const data = await resp.json();
            if (!resp.ok || data.error || !(data.return_options || []).length) {
              throw new Error(data.error || 'no returns');
            }
            const best = data.return_options[0];
            if (g.unpriced) {
              sec._fetched = { ...(sec._fetched || {}), [key]: {
                outbound: g.outbound, return_options: data.return_options,
                cheapest_total: data.cheapest_total, currency: data.currency,
                total_price: best.total_price, return: best,
                booking_url: best.booking_url, _full: true,
              } };
            } else {
              // keep the traveler's pick when the fuller list still has it
              const cur = g.return;
              g.return_options = data.return_options;
              const match = cur && data.return_options.find(r =>
                r.legs[0].departure === cur.legs[0].departure
                && r.legs[0].flight_number === cur.legs[0].flight_number);
              const pick = match || best;
              g.return = pick; g.total_price = pick.total_price;
              if (pick.booking_url) g.booking_url = pick.booking_url;
              g._full = true;
            }
          } catch (e) {
            sec._fetchErr = { ...(sec._fetchErr || {}), [key]: true };
          } finally {
            const f = { ...(sec._fetching || {}) }; delete f[key]; sec._fetching = f;
          }
        },

        rtReturns(sec) {
          const g = this.rtSelected(sec);
          if (!g || g.unpriced) return [];
          const flt = sec._filters || {};
          let rows = (g.return_options || []).filter(r => this._rowPass(r,
            { stops: flt.stops, airline: flt.airline, alliance: flt.alliance, maxDur: flt.maxDur }));
          if (flt.sort === 'price') rows = [...rows].sort((a, b) => (a.total_price ?? 1e9) - (b.total_price ?? 1e9));
          else if (flt.sort === 'duration') rows = [...rows].sort((a, b) => (a.duration ?? 1e9) - (b.duration ?? 1e9));
          else if (flt.sort === 'departure') rows = [...rows].sort((a, b) => (a.legs[0].departure || '').localeCompare(b.legs[0].departure || ''));
          return rows;
        },

        pickReturnOpt(g, r) {
          g.return = r;
          if (r.total_price != null) g.total_price = r.total_price;
          if (r.booking_url) g.booking_url = r.booking_url;
        },

        isPickedOpt(g, r) {
          const c = g.return;
          return !!c && r.legs[0].departure === c.legs[0].departure
            && r.legs[0].flight_number === c.legs[0].flight_number;
        },

        rtCurrency(g) { return g.currency || (g.outbound || {}).currency || 'USD'; },

        viaShort(f) {
          const ls = f.layovers || [];
          return ls.length ? ' via ' + ls.map(l => l.airport).join(', ') : '';
        },

        rtOutCount(sec) {
          const total = this.rtAll(sec).length, shown = this.rtOutbounds(sec).length;
          return '· ' + (shown === total ? total : shown + ' of ' + total);
        },

        rtRetNote(sec) {
          const g = this.rtSelected(sec);
          if (!g || g.unpriced) return '';
          const total = (g.return_options || []).length;
          const shown = this.rtReturns(sec).length;
          const legs = (g.return || {}).legs || [];
          const d = legs.length ? this.formatDate((legs[0].departure || '').slice(0, 10)) : '';
          const count = shown < total ? shown + ' of ' + total + ' options' : total + ' option' + (total === 1 ? '' : 's');
          return '· ' + count + (d ? ' · ' + d : '');
        },

        rtAskReturns(sec) {
          const g = this.rtSelected(sec);
          if (!g) return;
          const legs = (g.outbound || {}).legs || [];
          if (!legs.length) return;
          this.search('Price the returns for the ' + g.outbound.airline + ' outbound departing '
            + this.formatDate((legs[0].departure || '').slice(0, 10)) + ' at '
            + this.formatTime(legs[0].departure) + ' from ' + legs[0].from);
        },

        rtSummaryText(sec) {
          const g = this.rtSelected(sec);
          if (!g || g.unpriced) return '';
          const seg = legs => legs && legs.length
            ? legs[0].from + ' ' + this.formatTime(legs[0].departure) + ' → '
              + legs[legs.length - 1].to + ' ' + this.formatTime(legs[legs.length - 1].arrival)
            : '';
          return 'Out ' + seg(g.outbound.legs) + '    ·    Back ' + seg((g.return || {}).legs);
        },

        pickReturn(it, ri) {
          const r = (it.return_options || [])[ri];
          if (!r) return;
          it.return = r;
          if (r.total_price != null) it.total_price = r.total_price;
          if (r.booking_url) it.booking_url = r.booking_url;  // book what's shown
        },

        badgeClass(h) {
          const t = (h || '').toLowerCase();
          if (t.includes('best value')) return 'badge-best';
          if (t.includes('direct')) return 'badge-direct';
          if (t.includes('cheap')) return 'badge-cheap';
          if (t.includes('fast') || t.includes('quick')) return 'badge-fast';
          return 'badge-plain';
        },

        flightCodes(f) {
          const codes = (f.legs || []).map(l => l.airline_code + ' ' + l.flight_number).join(' · ');
          return f.alliance ? codes + ' · ' + f.alliance : codes;
        },

        stopsText(stops) {
          return stops === 0 ? 'Direct' : stops + ' stop' + (stops > 1 ? 's' : '');
        },

        stopPositions(f) {
          // place each connection on the timeline proportional to elapsed time
          const legs = f.legs || [];
          if (legs.length < 2) return [];
          const t0 = Date.parse(legs[0].departure || '');
          const t1 = Date.parse(legs[legs.length - 1].arrival || '');
          if (!t0 || !t1 || t1 <= t0) return [];
          return legs.slice(0, -1).map((l, i) => {
            const a = Date.parse(l.arrival || ''), d = Date.parse(legs[i + 1].departure || '');
            const mid = a && d ? (a + d) / 2 : (a || d);
            return { code: l.to, pct: Math.min(94, Math.max(6, ((mid - t0) / (t1 - t0)) * 100)) };
          }).filter(s => isFinite(s.pct));
        },

        arrivalDay(f) {
          const legs = f.legs || [];
          if (!legs.length) return '';
          const dep = (legs[0].departure || '').slice(0, 10);
          const arr = (legs[legs.length - 1].arrival || '').slice(0, 10);
          if (!dep || !arr || dep === arr) return '';
          const days = Math.round((new Date(arr + 'T12:00:00') - new Date(dep + 'T12:00:00')) / 86400000);
          // negative is real too (dateline crossings land the day before);
          // the model is told this marker matches the card, so it must
          return days > 0 ? ` +${days}` : days < 0 ? ` ${days}` : '';
        },

        layoverText(lo) {
          const dur = lo.duration ? Math.floor(lo.duration / 60) + 'h ' + (lo.duration % 60) + 'm' : '';
          return `Layover: ${dur} in ${lo.city || lo.airport} (${lo.airport})`;
        },

        formatPrice(p, currency) {
          if (p == null) return '—';
          try {
            return new Intl.NumberFormat('en-US', {
              style: 'currency', currency: currency || 'USD',
              minimumFractionDigits: 0, maximumFractionDigits: 0,
            }).format(p);
          } catch { return (currency || '$') + ' ' + Math.round(p); }
        },

        formatTime(t) {
          if (!t) return '—';
          if (t.includes('T')) return t.split('T')[1]?.slice(0, 5) || '—';
          return t.slice(0, 5);
        },

        formatDate(d) {
          if (!d) return '';
          const dt = new Date(d + 'T12:00:00');
          return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        },

        formatDuration(mins) {
          if (!mins) return '';
          return `${Math.floor(mins / 60)}h ${mins % 60}m`;
        },
      };
    }
  </script>
</body>
</html>
