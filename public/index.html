                          <div class="rt-rows">
                            <template x-for="(r, ri) in rtReturns(sec)" :key="'r' + ri">
                              <button class="rt-row" :class="isPickedOpt(rtSelected(sec), r) ? 'sel' : ''" @click="pickReturnOpt(rtSelected(sec), r)">
                                <div class="rt-row-main">
                                  <span class="rt-times" x-text="formatTime(r.legs[0].departure) + ' → ' + formatTime(r.legs[r.legs.length-1].arrival) + arrivalDay(r)"></span>
                                  <span class="rt-price total" x-text="formatPrice(r.total_price, r.currency)"></span>
                                </div>
                                <div class="rt-row-sub"><img class="logo-xs" :src="logoUrl(r.airline_code)" alt="" loading="lazy" onerror="this.remove()"><span x-text="r.airline + ' · ' + formatDuration(r.duration) + ' · ' + stopsText(r.stops) + viaShort(r) + (r.extra_over_best ? ' · +' + formatPrice(r.extra_over_best, r.currency) + ' vs cheapest pairing' : ' · cheapest pairing')"></span></div>
                                <div class="rt-row-tags" x-show="r.stops === 0 || (r.warnings || []).length">
                                  <span class="badge badge-direct" x-show="r.stops === 0">Direct</span>
                                  <span class="rt-tag warn" x-show="(r.warnings || []).length" :title="(r.warnings || []).join('  ·  ')">⚠</span>
                                </div>
                              </button>
                            </template>
                            <div class="rt-empty" x-show="!rtReturns(sec).length">No returns match these filters. Loosen them to see the rest.</div>
                            <button class="show-all rt-more" x-show="!rtSelected(sec)._full"
                                    :disabled="rtFetchState(sec) === 'loading'"
                                    @click="rtFetchReturns(sec, rtSelected(sec))"
                                    x-text="rtFetchState(sec) === 'loading' ? 'Loading every return…' : 'Load every return Google pairs with this outbound'"></button>
                          </div>
                        </template>
                        <template x-if="rtSelected(sec) && rtSelected(sec).unpriced">
                          <div class="rt-unpriced-panel">
                            <template x-if="rtFetchState(sec) === 'loading'">
                              <p><span class="loading-dot rt-dot"></span> Pricing the returns for this flight…</p>
                            </template>
                            <template x-if="rtFetchState(sec) !== 'loading'">
                              <div class="rt-unpriced-inner">
                                <p>This outbound exists at <b x-text="formatPrice(rtSelected(sec).from_total, rtCurrency(rtSelected(sec)))"></b><span x-text="' round trip' + paxSuffix(sec) + '.'"></span>
                                  <span x-show="rtFetchState(sec) === 'error'">Google didn't answer just now; it usually does on a second try.</span></p>
                                <button class="chip" @click="rtPrice(sec)" :disabled="isLoading">Price the returns for this flight</button>
                                <button class="chip" x-show="rtFetchState(sec) === 'error'" @click="rtAskReturns(sec)" :disabled="isLoading">Ask the concierge instead</button>
                              </div>
                            </template>
                          </div>
                        </template>
                        <div class="rt-empty" x-show="!rtSelected(sec)">Pick an outbound on the left.</div>
                      </div>
                    </div>
                    <div class="rt-summary" x-show="rtSelected(sec) && !rtSelected(sec).unpriced">
                      <div class="rt-summary-txt">
                        <div class="rt-summary-legs" x-text="rtSummaryText(sec)"></div>
                        <div class="rt-summary-price" x-text="rtSelected(sec) ? formatPrice(rtSelected(sec).total_price, rtCurrency(rtSelected(sec))) + ' total' + paxSuffix(sec) : ''"></div>
                      </div>
                      <a class="card-action rt-book" :href="rtSelected(sec) && rtSelected(sec).booking_url" target="_blank" rel="noopener noreferrer">Book this pairing</a><button class="share-quiet" @click="sharePairing(rtSelected(sec), sec)">Share</button>
                    </div>
                  </div>
                </template>

                <!-- when Google withholds the combined ticket price from our
                     session, the one-ticket answer is one tap away on its own
                     multi-city page for these exact legs -->
                <a class="show-all" style="display: block; text-align: center; text-decoration: none;"
                   x-show="sec.type === 'multicity' && sec.combined_check_url"
                   :href="sec.combined_check_url" target="_blank" rel="noopener noreferrer"
                   x-text="sec.rt_fallback ? 'Price this as one round-trip ticket on Google →' : 'Price the combined one-ticket itinerary on Google →'"></a>

                <!-- multi-city leg board: every leg's own one-way list, chosen

                <template x-if="mcBoardOpen(sec)">
                  <div class="rt-board-wrap">

                                  <div class="rt-row-main">

                                  <div class="rt-row-sub"><img class="logo-xs" :src="logoUrl(f.airline_code)" alt="" loading="lazy" onerror="this.remove()"><span x-text="f.legs[0].from + '–' + f.legs[f.legs.length-1].to + ' · ' + f.airline + ' · ' + formatDuration(f.duration) + ' · ' + stopsText(f.stops) + viaShort(f)"></span></div>
                                  <div class="rt-row-tags" x-show="f.stops === 0 || (f.warnings || []).length || (f.highlights || []).includes('Best value')">

                                    <span class="badge badge-direct" x-show="f.stops === 0">Direct</span>
                                    <span class="rt-tag warn" x-show="(f.warnings || []).length" :title="(f.warnings || []).join('  ·  ')">⚠</span>
                                  </div>
                                </button>
                              </template>
                              <div class="rt-empty" x-show="!mcLegRows(sec, leg).length">No flights on this leg match these filters.</div>
                            </div>
                          </template>
                          <template x-if="!(leg.results || []).length">
                            <div class="rt-unpriced-panel" :title="leg.detail || ''">
                              <p>Google didn't return this leg just now. That usually clears on a second try, and it does not mean there are no flights.</p>

                            </div>

                        </div>

                    </div>
                    <div class="rt-summary">
                      <div class="rt-summary-txt">
                        <div class="rt-summary-legs" x-text="mcSummaryText(sec)"></div>

                          ? formatPrice(mcTotal(sec), mcCurrency(sec)) + ' total' + paxSuffix(sec) + ' · separate tickets'
                          : 'Leg ' + mcMissing(sec).map(l => l.n).join(', ') + ' still needed for a total'"></div>
                        <div class="mc-note"><span>Separate tickets: no through-checked bags, and no protection if one leg runs late.</span><span x-show="mcOneTicketFrom(sec) != null" x-text="' One ticket on a single itinerary starts at ' + formatPrice(mcOneTicketFrom(sec), mcCurrency(sec)) + ' (see top picks).'"></span></div>
                      </div>
                      <div class="mc-books">
                        <template x-for="(p, k) in mcPicked(sec)" :key="'mb' + k">
                          <a class="card-action rt-book" x-show="p" :href="p && p.booking_url" target="_blank" rel="noopener noreferrer" x-text="'Book leg ' + (k + 1)"></a>
                        </template>
                        <button class="share-quiet" x-show="mcTotal(sec) != null" @click="shareMulti(mcPickedItin(sec), sec)">Share</button>
                      </div>
                    </div>
                  </div>
                </template>

                <!-- multi-city itineraries, compact -->
                <template x-if="sec.type === 'multicity' && sec.results && sec.results.length && sectionView(sec) === 'compact' && !mcBoardOpen(sec)">
                  <div class="compact-grid">

                      <div class="compact-card">
                        <div class="compact-top">
                          <div class="compact-airline"><img class="logo-xs" :src="logoUrl(it.parts[0].airline_code)" alt="" loading="lazy" onerror="this.remove()"><span x-text="[...new Set(it.parts.map(p => p.airline))].join(' + ')"></span></div>

                        <div class="compact-sub" x-text="(it.price_basis === 'separate tickets' ? 'as ' + (it.parts || []).length + ' separate tickets' : 'one combined ticket') + ((it.warnings || []).length ? ' · ⚠' : '')"></div>

                        <template x-if="mcPerLeg(it)"><div class="mc-leg-books"><template x-for="(p, k) in it.parts" :key="'cb' + k"><a :href="p.booking_url" target="_blank" rel="noopener noreferrer" class="compact-book" x-text="'Book leg ' + (k + 1) + ' →'"></a></template></div></template>
                        <button class="share-quiet" @click="shareMulti(it, sec)">Share</button>
                      </div>
                    </template>
                  </div>
                </template>

                <!-- multi-city itineraries, detailed -->
                <template x-if="sec.type === 'multicity' && sec.results && sec.results.length && sectionView(sec) === 'detailed' && !mcBoardOpen(sec)">
                  <div class="flight-list">
                    <template x-for="(it, j) in visible(sec, 5)" :key="j">
                      <div class="flight-card">
                        <div class="card-header">
                          <div class="airline-id">
                            <div class="airline-avatar" :style="'background:' + airlineColor(it.parts[0].airline_code)"><span x-text="it.parts[0].airline_code"></span><img :src="logoUrl(it.parts[0].airline_code)" alt="" loading="lazy" onerror="this.remove()"></div>
                            <div>
                              <div class="card-airline" x-text="[...new Set(it.parts.map(p => p.airline))].join(' + ')"></div>

                            </div>
                          </div>
                          <div>
                            <div class="card-price" x-text="formatPrice(it.total_price, it.currency)"></div>
                            <div class="card-price-note" x-text="'total' + paxSuffix(sec) + ', all legs · ' + (it.price_basis || 'one ticket')"></div>

                        <template x-for="(p, k) in it.parts" :key="k">
                          <div :style="k > 0 ? 'margin-top: 0.5rem;' : ''">

                                <div class="route-time" x-text="formatTime(p.legs[0].departure)"></div>

                              </div>
                              <div class="route-mid">
                                <div class="route-line"></div>
                            <template x-for="(s, si) in stopPositions(p)" :key="'st'+si">
                              <div class="route-stop" :style="'left:' + s.pct + '%'"><span class="route-stop-label" x-text="s.code"></span></div>
                            </template>
                                <div class="route-meta" x-text="formatDuration(p.duration) + ' · ' + stopsText(p.stops)"></div>
                              </div>
                              <div class="route-end">
                                <div class="route-time" x-text="formatTime(p.legs[p.legs.length-1].arrival)"></div>
                                <div class="route-port" x-text="p.legs[p.legs.length-1].to + arrivalDay(p)"></div>
                              </div>
                            </div>
                            <template x-for="(lo, m) in (p.layovers || [])" :key="m">
                              <div class="leg-detail" x-text="layoverText(lo)"></div>
                            </template>
                            <div class="leg-detail" x-show="aircraftText(p)" x-text="aircraftText(p)"></div>
                            <template x-for="(w, m) in (p.warnings || [])" :key="'w'+m">
                              <div class="warning" x-text="w"></div>
                            </template>
                          </div>
                        </template>
                        <template x-for="(w, k) in (it.warnings || [])" :key="'tw'+k">
                          <div class="warning" x-text="w"></div>
                        </template>
                        <div class="route-map" x-show="multiCityPoints(it).length > 1" x-html="mapSvg(multiCityPoints(it))"></div>
                        <template x-if="!mcPerLeg(it)"><a :href="it.booking_url" target="_blank" rel="noopener noreferrer" class="card-action">Book on Google Flights</a></template>
                        <template x-if="mcPerLeg(it)"><div class="mc-leg-books"><template x-for="(p, k) in it.parts" :key="'db' + k"><a :href="p.booking_url" target="_blank" rel="noopener noreferrer" class="card-action" x-text="'Book leg ' + (k + 1)"></a></template></div></template>
                        <button class="share-quiet" @click="shareMulti(it, sec)">Share</button>
                      </div>
                    </template>
                  </div>

                <!-- flexible-date prices: best-value chips collapsed, calendar heatmap expanded -->
                <template x-if="sec.type === 'dates' && sec.dates && sec.dates.length">
                  <div>
                    <div class="grid-coverage" x-show="sec.grid_coverage"
                         x-text="sec.grid_coverage ? ('Google priced only ' + sec.grid_coverage.priced_days + ' of ~' + sec.grid_coverage.window_days + ' days in this window just now — the gaps are not \'no flights\'. Ask me to re-run it or check a specific date.') : ''"></div>
                    <template x-if="!sec._expanded">
                      <div class="date-grid">

                            <span class="d" x-text="formatDate(d.date) + (d.return_date ? ' → ' + formatDate(d.return_date) : '')"></span>

                      </div>
                    </template>
                    <template x-if="sec._expanded">
                      <div>
                        <div class="cal-wrap">

                                <template x-for="(wd, wi) in ['S', 'M', 'T', 'W', 'T', 'F', 'S']" :key="'wd' + wi">

  <script>
    function flightApp() {
      // bump a suffix if the stored shape ever changes; old blobs just miss
      const CONVO_KEY = 'fa_convo_v1';
      const RECENTS_KEY = 'fa_recents_v1';
      return {
        messages: [],
        input: '',
        isLoading: false,
        hasSearched: false,
        history: [],
        // history carries the prose; the ledger carries the RESULTS those
        // words describe, so a follow-up about a card already on screen is
        // answered from the record instead of a fresh search
        ledgers: [],
        sectionSeq: 0,
        recents: [],
        examples: [
          'Cheapest nonstop from New York to Miami next weekend',
          'Boston to Lisbon in early March, back a week later',
          'Is JFK or Newark cheaper to London on December 18?',
          'New York to Tokyo, then Seoul back to New York in April',
        ],
        ladderOpen: false,
        viewMode: localStorage.getItem('flightViewMode') || 'detailed',
        theme: localStorage.getItem('flightTheme') === 'dark' ? 'dark' : 'light',
        newBelow: false,
        barRaised: false,
        loadingText: 'Thinking…',
        share: { open: false, imgUrl: null, blob: null, text: '', toast: '', canNative: false },
        ownerKey: (() => { try { return localStorage.getItem('fa_owner_key') || ''; } catch (e) { return ''; } })(),
        watch: { open: false, spec: null, query: '', title: '', subtitle: '', recipients: [], input: '',
                 freq: 1, threshold: '', key: '', busy: false, err: '', done: '' },
        briefings: { open: false, list: [], busy: false, err: '', key: '' },
        loadingTimer: null,
        controller: null,
        reqId: 0,

        init() {
          // one shared coastline definition; every mini-map references it via <use>
          if (!document.getElementById('worldpath')) {
            const holder = document.createElement('div');
            holder.innerHTML = `<svg style="position:absolute;width:0;height:0" aria-hidden="true"><defs><path id="worldpath" d="${WORLD_PATH}"/><path id="lakespath" d="${LAKES_PATH}"/></defs></svg>`;
            document.body.appendChild(holder.firstChild);
          }
          // the compose bar only earns its divider when content actually runs
          // underneath it; ResizeObserver catches replies growing the page
          this.syncBar();
          window.addEventListener('resize', () => this.syncBar());
          try {
            new ResizeObserver(() => this.syncBar()).observe(document.querySelector('.container'));
          } catch (e) { /* older browsers: scroll + resize still cover it */ }

          // scrolling the new reply into view dismisses the "results ready" nudge
          window.addEventListener('scroll', () => {
            this.syncBar();
            if (this.newBelow === false) return;
            const el = document.getElementById('msg-' + this.newBelow);
            if (!el || el.getBoundingClientRect().top < window.innerHeight - 120) this.newBelow = false;
          }, { passive: true });

          // the workspace survives a reload: recents feed the landing, and
          // the last conversation (prose + the freshest cards) comes back
          try { this.recents = JSON.parse(localStorage.getItem(RECENTS_KEY) || '[]') || []; }
          catch (e) { this.recents = []; }
          this.restoreConvo();
          try {
            const q = new URLSearchParams(location.search).get('q');
            if (q) {
              history.replaceState(null, '', location.pathname);
              this.$nextTick(() => this.search(q));
            }
          } catch (e) { /* a malformed URL just opens the page */ }

          // warm the backend before the first search: on load, and again
          // whenever a backgrounded tab returns (the classic 'I opened it to
          // show someone and it just spun' case is a cold instance)
          this.warm();
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') this.warm();
          });
        },


        syncBar() {
          // Scrollable means real content can pass under the bar, which is the
          // only time a divider is telling the truth. Measuring "content below
          // the bar's top edge" instead would count the container's own bottom
          // padding and raise the divider even on the empty landing screen.
          this.barRaised = document.documentElement.scrollHeight > window.innerHeight + 2;
        },

        maybeNudge() {
          // no auto-scroll on completion by design; instead, offer a jump
          // when the reply landed below the current viewport
          this.$nextTick(() => {
            const i = this.messages.length - 1;
            const el = document.getElementById('msg-' + i);
            if (el && el.getBoundingClientRect().top > window.innerHeight - 120) this.newBelow = i;
          });
        },

        jumpToNew() {
          const el = document.getElementById('msg-' + this.newBelow);
          this.newBelow = false;
          el?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        },

        scrollToBottom() {
          this.$nextTick(() => { this.$refs.bottom?.scrollIntoView({ behavior: 'smooth' }); });
        },

        setView(mode) {
          this.viewMode = mode;
          localStorage.setItem('flightViewMode', mode);
          // global switch resets any per-section overrides
          this.messages.forEach(m => (m.sections || []).forEach(s => { delete s._view; }));
        },

        sectionView(sec) {
          return sec._view || this.viewMode;
        },

        cycleTheme() {
          this.theme = this.theme === 'light' ? 'dark' : 'light';
          localStorage.setItem('flightTheme', this.theme);
          window.__applyTheme();
        },
        themeIcon() {
          return this.theme === 'dark' ? '☾' : '☀';
        },
        themeTitle() {
          return this.theme === 'dark' ? 'Theme: dark — click for light' : 'Theme: light — click for dark';
        },

        // --- instant client-side browse: filter/sort/expand over already-fetched results ---
        _legsOf(sec, x) {
          if (sec.type === 'itineraries') return x.outbound.legs;
          if (sec.type === 'multicity') return x.parts[0].legs;
          return x.legs;
        },
        _priceOf(sec, x) { return sec.type === 'flights' ? x.price : x.total_price; },
        _durOf(sec, x) {
          if (sec.type === 'itineraries') return (x.outbound.duration || 0) + (x.return.duration || 0);
          if (sec.type === 'multicity') return x.parts.reduce((s, p) => s + (p.duration || 0), 0);
          return x.duration;
        },
        _directOf(sec, x) {
          if (sec.type === 'itineraries') return x.outbound.stops === 0 && x.return.stops === 0;
          if (sec.type === 'multicity') return x.parts.every(p => p.stops === 0);
          return x.stops === 0;
        },

        _stopsOf(sec, x) {
          if (sec.type === 'itineraries') return Math.max(x.outbound.stops, x.return.stops);
          if (sec.type === 'multicity') return Math.max(...x.parts.map(p => p.stops));
          return x.stops;
        },
        _partsOf(sec, x) {
          return sec.type === 'itineraries' ? [x.outbound, x.return]
               : sec.type === 'multicity' ? x.parts : [x];
        },
        _airlinesOf(sec, x) {
          return this._partsOf(sec, x).flatMap(p => (p.legs || []).map(l => l.airline_code));
        },

        list(sec) { return this._applyFilters(sec, sec.results || [], sec._filters); },

        // `shape` only decides how a row is read (a flight, a round-trip
        // pairing, a multi-city combo); the board passes {type:'flights'}
        // so the same filter bar drives every leg's own list
        _applyFilters(shape, rs, f) {
          const sec = shape;
          f = f || {};
          if (f.dep) {
            const inB = (h, b) => b === 'early' ? h < 8 : b === 'morning' ? (h >= 8 && h < 12) : b === 'afternoon' ? (h >= 12 && h < 18) : h >= 18;
            rs = rs.filter(x => {
              const t = this._legsOf(sec, x)[0].departure;
              return inB(t ? parseInt(t.slice(11, 13), 10) : 0, f.dep);
            });
          }
          if (f.maxDur) rs = rs.filter(x => (this._durOf(sec, x) ?? 1e9) <= f.maxDur * 60);
          if (f.airline) rs = rs.filter(x => this._airlinesOf(sec, x).includes(f.airline));
          if (f.alliance) rs = rs.filter(x => this._partsOf(sec, x).some(p => p.alliance === f.alliance));
          if (f.stops !== '' && f.stops != null) rs = rs.filter(x => this._stopsOf(sec, x) <= +f.stops);
          if (f.sort === 'price') rs = [...rs].sort((a, b) => (this._priceOf(sec, a) ?? 1e9) - (this._priceOf(sec, b) ?? 1e9));
          else if (f.sort === 'duration') rs = [...rs].sort((a, b) => (this._durOf(sec, a) ?? 1e9) - (this._durOf(sec, b) ?? 1e9));
          else if (f.sort === 'departure') rs = [...rs].sort((a, b) => (this._legsOf(sec, a)[0].departure || '').localeCompare(this._legsOf(sec, b)[0].departure || ''));
          return rs;
        },

        // what the filter dropdowns enumerate: the board's leg flights, or the cards
        _optionRows(sec) {
          return this.mcBoardOpen(sec)
            ? [{ type: 'flights' }, (sec.legs || []).flatMap(l => l.results || [])]
            : [sec, sec.results || []];
        },

        durationOptions(sec) {
          const [shape, rows] = this._optionRows(sec);
          const durs = rows.map(x => this._durOf(shape, x)).filter(Boolean);
          if (!durs.length) return [];
          const minH = Math.min(...durs) / 60, maxH = Math.max(...durs) / 60;
          return [4, 6, 8, 10, 12, 15, 18, 24, 30, 36, 48].filter(h => h > minH && h < maxH).slice(0, 4);
        },

        airlineOptions(sec) {
          const seen = new Map();
          const [shape, rows] = this._optionRows(sec);
          for (const x of rows) {
            for (const p of this._partsOf(shape, x)) {
              if (p.airline_code && !seen.has(p.airline_code)) seen.set(p.airline_code, p.airline);
            }
          }
          return [...seen].map(([code, name]) => ({ code, name })).sort((a, b) => (a.name || '').localeCompare(b.name || ''));
        },

        allianceOptions(sec) {
          const seen = new Set();
          const [shape, rows] = this._optionRows(sec);
          for (const x of rows) {
            for (const p of this._partsOf(shape, x)) if (p.alliance) seen.add(p.alliance);
          }
          return [...seen].sort();
        },

        visible(sec, previewN) {
          const rs = this.list(sec);
          // with a leg board, the collapsed view IS the top picks: show them all
          return sec._expanded || this.mcHasLegs(sec) ? rs : rs.slice(0, previewN);
        },

        // ---- multi-city leg board: every leg's own one-way list, chosen per
        // leg, totalled as separate tickets. Nov 11: the pre-paired combos
        // showed TWO of 120 NYC -> Hanoi flights; the legs now ship whole. ----
        mcHasLegs(sec) {
          return sec.type === 'multicity' && (sec.legs || []).some(l => (l.results || []).length);
        },
        mcBoardOpen(sec) { return this.mcHasLegs(sec) && !!sec._expanded; },
        mcKey(f) {
          return ((f && f.legs) || []).map(l => l.airline_code + l.flight_number + (l.departure || '')).join('|');
        },
        mcLegRows(sec, leg) { return this._applyFilters({ type: 'flights' }, leg.results || [], sec._filters); },
        mcLegNote(sec, leg) {
          const n = (leg.results || []).length;
          if (!n) return 'not back yet';
          const shown = this.mcLegRows(sec, leg).length;
          return (shown < n ? shown + ' of ' + n : n) + ' flights'
            + (leg.cheapest != null ? ' · from ' + this.formatPrice(leg.cheapest, 'USD') : '');
        },
        mcSel(sec, leg) {
          const rows = leg.results || [];
          const key = (sec._mcSel || {})[leg.n];
          return rows.find(f => this.mcKey(f) === key) || rows[0] || null;  // default: best value
        },
        mcIsSel(sec, leg, f) { const s = this.mcSel(sec, leg); return !!s && this.mcKey(s) === this.mcKey(f); },
        mcPick(sec, leg, f) { sec._mcSel = { ...(sec._mcSel || {}), [leg.n]: this.mcKey(f) }; },
        mcPicked(sec) { return (sec.legs || []).map(l => ((l.results || []).length ? this.mcSel(sec, l) : null)); },
        mcMissing(sec) { return (sec.legs || []).filter(l => !(l.results || []).length); },
        mcTotal(sec) {
          const ps = this.mcPicked(sec);
          if (!ps.length || ps.some(p => !p || p.price == null)) return null;
          return ps.reduce((s, p) => s + p.price, 0);
        },
        mcCurrency(sec) { return (this.mcPicked(sec).find(Boolean) || {}).currency || 'USD'; },
        mcOneTicketFrom(sec) {
          const one = (sec.results || []).filter(r => r.price_basis === 'one ticket' && r.total_price != null);
          return one.length ? Math.min(...one.map(r => r.total_price)) : null;
        },
        mcSummaryText(sec) {
          return this.mcPicked(sec).map((p, k) => p
            ? 'Leg ' + (k + 1) + ' ' + p.airline + ' ' + this.formatTime(p.legs[0].departure)
              + '→' + this.formatTime(p.legs[p.legs.length - 1].arrival) + this.arrivalDay(p)
            : 'Leg ' + (k + 1) + ' not back yet').join(' · ');
        },
        mcPickedItin(sec) {
          return { parts: this.mcPicked(sec).filter(Boolean), total_price: this.mcTotal(sec),
                   currency: this.mcCurrency(sec), price_basis: 'separate tickets', book_per_leg: true };
        },
        // separate tickets have no single booking URL: each leg books on its own
        mcPerLeg(it) { return !!(it && (it.book_per_leg || it.price_basis === 'separate tickets')); },
        mcAskLeg(leg) {
          this.search('One way ' + (leg.label || '').replace(' → ', ' to ') + ' on ' + leg.date);
        },

        visibleDates(sec) {
          const all = sec.dates || [];
          // a bounded window ("mid-late December", ~3 weeks) shows every
          // priced day, cheapest outlined; only month-plus windows collapse
          if (sec._expanded || all.length <= 21) return all;
          // default view: only dates worth considering (within 15% of cheapest)
          const min = Math.min(...all.map(d => d.price));
          let best = all.filter(d => d.price <= min * 1.15);
          if (best.length < 6) best = [...all].sort((a, b) => a.price - b.price).slice(0, 6);
          if (best.length > 14) best = [...best].sort((a, b) => a.price - b.price).slice(0, 14);
          const keep = new Set(best.map(d => d.date + '|' + (d.return_date || '')));
          return all.filter(d => keep.has(d.date + '|' + (d.return_date || '')));
        },

        // the calendar heatmap behind "Show the full calendar": months of the
        // searched window, each day tinted by how its fare compares to the
        // window's cheapest (tiers are ratios, so one absurd outlier cannot
        // wash out the scale)
        calendarMonths(sec) {
          const byDate = {};   // departure date -> cheapest pairing that day
          for (const d of (sec.dates || [])) {
            const cur = byDate[d.date];
            if (!cur || d.price < cur.price) byDate[d.date] = d;
          }
          const entries = Object.values(byDate);
          if (!entries.length) return [];
          const min = Math.min(...entries.map(d => d.price));
          const heat = p => p <= min * 1.05 ? 0 : p <= min * 1.15 ? 1 : p <= min * 1.35 ? 2 : p <= min * 1.65 ? 3 : 4;
          const months = [];
          let cur = null;
          for (const key of Object.keys(byDate).sort()) {
            const [y, m, day] = key.split('-').map(Number);
            if (!cur || cur.y !== y || cur.m !== m) {
              cur = {
                key: y + '-' + m, y, m, days: {},
                label: new Date(y, m - 1, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' }),
              };
              months.push(cur);
            }
            cur.days[day] = { ...byDate[key], heat: heat(byDate[key].price) };
          }
          for (const mo of months) {
            const firstDow = new Date(mo.y, mo.m - 1, 1).getDay();
            const nDays = new Date(mo.y, mo.m, 0).getDate();
            mo.cells = [];
            for (let i = 0; i < firstDow; i++) mo.cells.push({ day: null, d: null });
            for (let day = 1; day <= nDays; day++) mo.cells.push({ day, d: mo.days[day] || null });
          }
          return months;
        },

        calCellTitle(d) {
          let t = this.formatDate(d.date);
          if (d.return_date) t += ' → ' + this.formatDate(d.return_date);
          t += ' · ' + this.formatPrice(d.price, d.currency);
          if (d.return_date) t += ' round trip';
          return t;
        },

        calNote(sec) {
          const withRet = (sec.dates || []).filter(d => d.return_date);
          if (!withRet.length) return 'Tap a date to see the flights.';
          const nights = new Set(withRet.map(d =>
            Math.round((new Date(d.return_date + 'T12:00:00') - new Date(d.date + 'T12:00:00')) / 86400000)));
          if (nights.size !== 1) return 'Round-trip totals. Hover a date for its return day; tap to see the flights.';
          const n = [...nights][0];
          return n === 0
            ? 'Round-trip totals for same-day returns. Tap a date to see the flights.'
            : 'Round-trip totals for ' + n + '-night trips. Tap a date to see the flights.';
        },

        // ---- price context: where this fare sits among NEARBY DATES. Not
        // price history, and the wording never implies otherwise. ----
        pcTier(sec) {
          const p = (sec.price_context || {}).percentile;
          if (p === undefined || p === null) return '';
          return p <= 40 ? 'pc-low' : p >= 60 ? 'pc-high' : '';
        },

        pcHeadline(sec) {
          const p = sec.price_context; if (!p) return '';
          // name the date: the value ranking leads with the best trip, so the
          // top card is often not the fare being characterized here
          const on = p.searched_date ? ' on ' + this.formatDate(p.searched_date) : '';
          return 'Lowest fare' + on + ', ' + this.formatPrice(p.quoted, 'USD')
            + ', is ' + p.verdict + '.';
        },

        pcDetail(sec) {
          const p = sec.price_context; if (!p) return '';
          const c = p.cheapest_nearby;
          if (!c) return '';
          if (Math.round(c.price) >= Math.round(p.quoted)) {
            return 'No nearby date prices lower.';
          }
          return 'Cheapest nearby is ' + this.formatDate(c.date) + ' at '
            + this.formatPrice(c.price, 'USD') + '.';
        },

        pcNote(sec) {
          const p = sec.price_context; if (!p) return '';
          return '(' + p.dates_priced + ' nearby dates priced, '
            + (p.basis || '') + '; not price history)';
        },

        calPrice(d) {
          if (d.price >= 10000) return '$' + Math.round(d.price / 1000) + 'k';
          return this.formatPrice(d.price, d.currency);
        },

        canExpand(sec) {
          if (sec.type === 'dates') return (sec.dates || []).length > 12;
          // board <-> top picks; with no complete combo the board is the only view
          if (this.mcHasLegs(sec)) return (sec.results || []).length > 0;
          if (sec.type === 'itineraries') {
            // the board earns its place whenever there is anything to compose
            return (sec.results || []).length > 1 || (sec.more_outbounds || []).length > 0
              || (((sec.results || [])[0] || {}).return_options || []).length > 1;
          }
          return (sec.results || []).length > (this.sectionView(sec) === 'compact' ? 8 : 5);
        },

        expandLabel(sec) {
          if (sec.type === 'dates') {
            return sec._expanded ? 'Show best-value dates only'
              : 'Show the full calendar · all ' + (sec.dates || []).length + ' dates';
          }
          if (sec.type === 'itineraries') {
            return sec._expanded ? 'Show top picks only'
              : 'Mix & match all ' + this.rtAll(sec).length + ' outbounds · filter & sort';
          }
          if (this.mcHasLegs(sec)) {
            return sec._expanded ? 'Show top picks only'
              : 'Choose each leg · ' + (sec.legs || []).map(l => (l.results || []).length).join(' + ') + ' flights';
          }
          return sec._expanded ? 'Show top picks only'
            : 'Show all ' + this.list(sec).length + ' options · filter & sort';
        },

        setF(sec, key, value) {
          if (!sec._filters) sec._filters = {};
          sec._filters[key] = value;
        },


        multiCityPoints(it) {
          const pts = [];
          (it.parts || []).forEach(p => (p.route_points || []).forEach(pt => {
            if (!pts.length || pts[pts.length - 1].code !== pt.code) pts.push(pt);
          }));
          return pts;
        },

        autosize() {
          const el = this.$refs.box;
          if (!el) return;
          // An empty box must never keep a grown height. Measuring during the
          // same tick that tears down the landing page could read a stale
          // scrollHeight and pin the field open at its 10rem maximum, which
          // the sticky bar then kept on screen permanently.
          if (!el.value) { el.style.height = ''; return; }
          el.style.height = 'auto';
          el.style.height = Math.min(el.scrollHeight, 160) + 'px';
        },

        onEnter(e) {
          // an IME user's Enter commits the composition ("東京"), not the
          // message — keydown fires with isComposing (or legacy keyCode 229)
          if (e.isComposing || e.keyCode === 229) return;
          if (e.shiftKey) return; // allow newline
          e.preventDefault();
          this.search();
        },

        startLoadingCycle() {
          // phrases must be honest for ANY query (not every turn searches fares)
          const openers = ['One moment…', 'Right away…', 'Let me see…', 'On it…'];
          const working = [
            'Looking into that for you…', 'Consulting my sources…',
            'Checking the details…', 'Gathering what you need…',
            'A little patience, well spent…', 'Cross-checking a few things…',
          ];
          const long = ['Nearly there, thorough answers take a moment…', 'Still with it, almost done…'];
          const pick = arr => arr[Math.floor(Math.random() * arr.length)];
          const sequence = [pick(openers), pick(working), pick(working), pick(long)];
          let i = 0;
          this.loadingText = sequence[0];
          this.loadingTimer = setInterval(() => {
            i = Math.min(i + 1, sequence.length - 1);
            this.loadingText = sequence[i];
          }, 6000);
        },

        stopLoadingCycle() {
          clearInterval(this.loadingTimer);
        },

        stop(silent) {
          if (!this.isLoading) return;
          this.controller?.abort();
          // once 'done' has arrived the fetch is finished and abort is a
          // no-op, but the typewriter is still draining — invalidate the
          // turn so the tick loop and finalize both bail, and release any
          // pending drain so streamTurn's await resolves
          this.reqId++;
          const r = this._drainResolve; this._drainResolve = null; if (r) r();
          this.isLoading = false;
          this.stopLoadingCycle();
          // an interrupted streaming reply keeps its partial text, minus the
          // caret; one stopped before ANY text landed would render as an
          // empty paper panel forever — drop it instead
          const last = this.messages[this.messages.length - 1];
          if (last && last._streaming) {
            last._streaming = false;
            if (!last.content && !(last.sections || []).length) this.messages.pop();
          }
          // mark the interruption so Claude reads the next message as a correction
          this.history.push({ role: 'assistant', content: '(Search interrupted by the user before results came back.)' });
          this.history = this.history.slice(-12);
          if (!silent) {
            this.messages.push({ role: 'note', content: 'Search stopped — tell me what to change.' });
            this.scrollToBottom();
          }
          this.persistConvo();
        },

        async search(queryOverride) {
          const q = (queryOverride || this.input).trim();
          if (!q) return;
          if (this.isLoading) this.stop(true); // correcting mid-search: cancel and restart

          this._lastQ = q; // the recents record re-asks this verbatim
          const myReq = ++this.reqId;
          this.controller = new AbortController();

          // clear the box only when it was the source of the query — a
          // suggestion chip or calendar tap must not wipe a half-typed draft
          if (!queryOverride) {
            this.input = '';
            this.$nextTick(() => this.autosize());
          }
          this.hasSearched = true;
          this.messages.push({ role: 'user', content: q });
          this.isLoading = true;
          this.startLoadingCycle();
          this.scrollToBottom();

          // record the user turn now so a stopped search still leaves context
          this.history.push({ role: 'user', content: q });

          try {
            // Streaming first: the recommendation types out as Claude writes
            // it, the cards land after the prose. Any transport problem falls
            // back to the plain JSON turn, so streaming can only ever add.
            await this.streamTurn(q, myReq);
          } catch (err) {
            if (err.name === 'AbortError') return; // stop() already recorded the interruption
            if (myReq !== this.reqId) return;
            this.dropStreamingMsg();
            const slowMsg = 'That is taking unusually long on my end. The service may be waking from a rest; tap below and it should come right back.';
            if (err.netTimeout) {
              // server alive but grinding: a fresh identical request would grind
              // too, so offer a manual retry instead of auto-re-running
              this.messages.push({ role: 'assistant', content: slowMsg, sections: [], suggestions: [q] });
              this.maybeNudge();
            } else if (err.serverTurn) {
              // the turn itself failed server-side; re-running it would just
              // pay for the same failure again
              this.messages.push({ role: 'assistant', content: `Something went wrong: ${err.message}. Try again in a moment.`, sections: [], suggestions: [q] });
              this.maybeNudge();
            } else {
              // stream unavailable OR a dead-socket stall: a fresh request may
              // reach a healthy instance, so try the plain turn. If the stall
              // watchdog just aborted the controller to kill the dead stream,
              // the fallback needs a FRESH one, or its fetch is born aborted
              // and returns nothing (stop() keeps working: it reads whichever
              // controller is current).
              if (this.controller.signal.aborted) this.controller = new AbortController();
              try {
                await this.plainTurn(q, myReq);
              } catch (err2) {
                if (err2.name === 'AbortError' || myReq !== this.reqId) return;
                const msg = err2.netTimeout ? slowMsg : `Something went wrong: ${err2.message}. Try again in a moment.`;
                this.messages.push({ role: 'assistant', content: msg, sections: [], suggestions: [q] });
                this.maybeNudge();
              }
            }
          } finally {
            if (myReq === this.reqId) {
              this.isLoading = false;
              this.stopLoadingCycle();
              // no auto-scroll on completion — stay where the reader is
            }
          }
        },

        // the pre-streaming turn: the fallback path, now itself bounded so it
        // can never become a second silent hang (a plain fetch has no more
        // timeout than the stream did)
        async plainTurn(q, myReq) {
          let timedOut = false;
          const to = setTimeout(() => { timedOut = true; try { this.controller.abort(); } catch (e) {} }, 95000);
          try {
            const res = await fetch('/api/search', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ query: q, history: this.history.slice(0, -1), ledgers: this.ledgers }),
              signal: this.controller.signal,
            });
            const data = await res.json();
            if (data.error) throw new Error(data.error);
            if (myReq !== this.reqId) return; // superseded by a newer request

            this.history.push({ role: 'assistant', content: data.message });
            this.history = this.history.slice(-12);
            this.rememberLedger(data.ledger);

            (data.sections || []).forEach(sec => { sec._anchor = 'sec-' + (++this.sectionSeq); this.openBoard(sec); });
            this.messages.push({
              role: 'assistant',
              content: data.message,
              sections: data.sections || [],
              suggestions: data.suggestions || [],
            });
            this.maybeNudge();
            this.persistConvo();
            this.startBackfills(this.messages[this.messages.length - 1]);
          } catch (err) {
            if (timedOut) { const e = new Error('timeout'); e.netTimeout = true; throw e; }
            throw err;
          } finally {
            clearTimeout(to);
          }
        },

        async streamTurn(q, myReq) {
          this._streamBuf = '';
          this._doneData = null;
          this._typing = false;
          this._finalized = false;
          this._drainResolve = null;
          this._netStall = false;
          this._netTimeout = false;
          this.messages.push({ role: 'assistant', content: '', sections: [], suggestions: [], _streaming: true });

          // Network watchdogs — the fix for 'it spins forever and never
          // returns', which hits phones most. On mobile the SSE socket dies
          // SILENTLY (radio sleep, Wi-Fi/cell handoff): no error, no FIN, so
          // reader.read() below would hang until the OS reaps the dead socket
          // (minutes) or never. The fetch signal only aborts on user stop, so
          // nothing rescued it. Two independent guards, both abort the fetch:
          //  - INACTIVITY: the server sends a byte at least every 15s (': open'
          //    then ': ping'), so 30s of TOTAL silence means the connection is
          //    dead. Fall back to the plain turn: a fresh request may reach a
          //    healthy instance.
          //  - CEILING: bytes still trickling but no result after 110s means
          //    the server is alive but grinding; offer a retry rather than
          //    spin, since a re-run would grind identically.
          const STALL_MS = 30000, CEILING_MS = 110000;
          let lastByte = Date.now();
          const startedAt = Date.now();
          this._clearNetWatch();
          this._netWatch = setInterval(() => {
            if (myReq !== this.reqId || this._doneData) { this._clearNetWatch(); return; }
            if (Date.now() - lastByte > STALL_MS) {
              this._netStall = true; this._clearNetWatch();
              try { this.controller.abort(); } catch (e) {}
            } else if (Date.now() - startedAt > CEILING_MS) {
              this._netTimeout = true; this._clearNetWatch();
              try { this.controller.abort(); } catch (e) {}
            }
          }, 2500);

          try {
            const res = await fetch('/api/search/stream', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ query: q, history: this.history.slice(0, -1), ledgers: this.ledgers }),
              signal: this.controller.signal,
            });
            if (!res.ok || !res.body || !(res.headers.get('content-type') || '').includes('text/event-stream')) {
              throw new Error('stream unavailable');
            }
            const reader = res.body.getReader();
            const dec = new TextDecoder();
            let acc = '';
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              lastByte = Date.now();   // ANY chunk, ': ping' included, proves the socket is live
              if (myReq !== this.reqId) { reader.cancel().catch(() => {}); return; }
              acc += dec.decode(value, { stream: true });
              let idx;
              while ((idx = acc.indexOf('\n\n')) >= 0) {
                const frame = acc.slice(0, idx); acc = acc.slice(idx + 2);
                let ev = 'message', data = '';
                for (const line of frame.split('\n')) {
                  if (line.startsWith('event:')) ev = line.slice(6).trim();
                  else if (line.startsWith('data:')) data += line.slice(5).trim();
                }
                let body = null;
                if (data) { try { body = JSON.parse(data); } catch { continue; } }
                if (ev === 'text_delta') {
                  this._streamBuf += (body || '');
                  this.startTyping(myReq);
                } else if (ev === 'text_reset') {
                  // whatever streamed was a lead-in to a search, not the answer
                  this._streamBuf = '';
                  this.liveMsg().content = '';
                } else if (ev === 'done') {
                  this._doneData = body || {};
                  this._clearNetWatch(); // full result in hand; the local typewriter must not trip a watchdog
                } else if (ev === 'error') {
                  const e = new Error((body && body.error) || 'server error');
                  e.serverTurn = true;
                  throw e;
                }
                // 'sections' frames are deliberately not rendered here: the
                // reveal order is prose first, then cards — 'done' carries all
              }
            }
            if (!this._doneData) throw new Error('stream ended without a result');
            this.startTyping(myReq); // covers a turn that streamed no text at all
            await new Promise(resolve => {
              this._drainResolve = resolve;
              this.maybeFinishStream(myReq);
            });
          } catch (err) {
            // a watchdog abort surfaces as AbortError; relabel it so the caller
            // routes it (fallback / retry) instead of treating it as a user stop
            if (this._netStall) { const e = new Error('connection stalled'); e.netStall = true; throw e; }
            if (this._netTimeout) { const e = new Error('taking too long'); e.netTimeout = true; throw e; }
            throw err;
          } finally {
            this._clearNetWatch();
          }
        },

        _clearNetWatch() {
          if (this._netWatch) { clearInterval(this._netWatch); this._netWatch = null; }
        },

        // wake the serverless instance and warm the slow Google + Anthropic
        // connections BEFORE the first search, so 'first search after a while'
        // is not cold. Fire-and-forget, throttled so it never floods; the
        // server side is free of API spend. Skipped while a search is in
        // flight (its own connections are hot).
        warm() {
          const now = Date.now();
          if (this.isLoading) return;
          if (this._lastWarm && now - this._lastWarm < 45000) return;
          this._lastWarm = now;
          try { fetch('/api/warm', { method: 'GET', keepalive: true }).catch(() => {}); } catch (e) {}
        },

        liveMsg() { return this.messages[this.messages.length - 1]; },

        // round trips open ON the mix & match board: choosing per direction
        // is the product (Google's own flow); pre-paired cards are the summary
        openBoard(sec) {
          if (sec.type === 'itineraries' && ((sec.results || []).length || (sec.more_outbounds || []).length)) {
            sec._expanded = true;
          }
          // multi-city opens ON its leg board: choosing per leg is the product
          if (this.mcHasLegs(sec)) sec._expanded = true;
        },

        startTyping(myReq) {
          if (this._typing) return;
          this._typing = true;
          // rAF gives the smooth 60fps cadence, but browsers starve rAF in
          // hidden or occluded tabs — without the timer watchdog, a reply
          // would never finish typing (or finalize) in a background tab
          const schedule = (fn) => {
            let ran = false;
            const run = () => { if (ran) return; ran = true; fn(); };
            const t = setTimeout(run, 120);
            requestAnimationFrame(() => { clearTimeout(t); run(); });
          };
          const tick = () => {
            if (myReq !== this.reqId) { this._typing = false; return; }
            const buf = this._streamBuf;
            if (buf.length) {
              // adaptive cadence: a deeper backlog lands more characters per
              // frame, so the typing can never fall behind the network; a
              // hidden page flushes outright — no one is watching the animation
              // eased cadence: fast enough to never dawdle on a long
              // reply, slow enough to read as typing rather than pasting
              const n = document.hidden ? buf.length
                : Math.min(Math.max(this._doneData ? 3 : 2, Math.ceil(buf.length / 45)), 14);
              this.liveMsg().content += buf.slice(0, n);
              this._streamBuf = buf.slice(n);
              schedule(tick);
              return;
            }
            this._typing = false;
            if (this._doneData) this.maybeFinishStream(myReq);
            // buffer empty mid-turn: go idle; the next text_delta restarts us
          };
          schedule(tick);
        },

        maybeFinishStream(myReq) {
          const release = () => {
            const r = this._drainResolve; this._drainResolve = null; if (r) r();
          };
          if (myReq !== this.reqId || this._finalized) { release(); return; }
          if (!this._doneData || this._streamBuf.length || this._typing) return;
          const d = this._doneData;
          const msg = this.liveMsg();
          msg.content = d.message || msg.content;   // 'done' is authoritative
          (d.sections || []).forEach(sec => { sec._anchor = 'sec-' + (++this.sectionSeq); this.openBoard(sec); });
          msg.sections = d.sections || [];
          msg.suggestions = d.suggestions || [];
          msg._streaming = false;
          this._finalized = true;
          this.history.push({ role: 'assistant', content: d.message || '' });
          this.history = this.history.slice(-12);
          this.rememberLedger(d.ledger);
          this.maybeNudge();
          this.persistConvo();
          this.startBackfills(msg);
          release();
        },

        // the compact record of what this turn put on screen; the next turn
        // sends it back so a follow-up about these exact cards costs no search
        rememberLedger(led) {
          this.rememberRecent(this._lastQ, led);
          if (!led || !(led.entries || []).length) return;
          this.ledgers.push(led);
          this.ledgers = this.ledgers.slice(-2);
        },

        // ---- memory: the conversation survives a reload, and the landing
        // greets you with your recent trips. Per-device (localStorage, no
        // login). A remembered fare must never impersonate a live one, so
        // every stored price carries its age and re-pricing is one tap. ----
        persistConvo() {
          const strip = (k, v) => (typeof k === 'string' && k.startsWith('_')) ? undefined : v;
          try {
            const keep = this.messages.slice(-12);
            // full sections survive only on the last 2 card-bearing replies —
            // the same budget the ledger gives the model; older turns keep
            // their prose and chips, not their cards
            const withCards = keep.filter(m => m.role === 'assistant' && (m.sections || []).length).slice(-2);
            const slim = keep.map(m => m.role === 'assistant'
              ? { role: m.role, content: m.content, suggestions: m.suggestions || [],
                  sections: withCards.includes(m) ? (m.sections || []) : [] }
              : { role: m.role, content: m.content });
            localStorage.setItem(CONVO_KEY, JSON.stringify(
              { v: 1, savedAt: Date.now(), history: this.history.slice(-12),
                ledgers: this.ledgers, messages: slim }, strip));
          } catch (e) {
            // quota blown: keep the transcript, drop every card
            try {
              localStorage.setItem(CONVO_KEY, JSON.stringify({
                v: 1, savedAt: Date.now(), history: this.history.slice(-12), ledgers: [],
                messages: this.messages.slice(-12).map(m => ({
                  role: m.role, content: m.content, suggestions: m.suggestions || [], sections: [] })),
              }));
            } catch (e2) { /* memory degrades to this session only */ }
          }
        },

        restoreConvo() {
          let saved = null;
          try { saved = JSON.parse(localStorage.getItem(CONVO_KEY) || 'null'); } catch (e) { return; }
          if (!saved || saved.v !== 1 || !(saved.messages || []).length) return;
          this.history = saved.history || [];
          this.ledgers = saved.ledgers || [];
          saved.messages.forEach(m => (m.sections || []).forEach(sec => {
            sec._anchor = 'sec-' + (++this.sectionSeq);
            this.openBoard(sec);
          }));
          // honesty at the seam: say once how old the resumed fares are
          if (Date.now() - (saved.savedAt || 0) > 45 * 60 * 1000) {
            saved.messages.push({ role: 'note', content:
              'Resumed from ' + this.agoText(saved.savedAt) +
              '. Fares shown were quoted then — ask me to re-check any of them.' });
          }
          this.messages = saved.messages;
          this.hasSearched = true;
          this.$nextTick(() => { this.$refs.bottom?.scrollIntoView(); this.syncBar(); });
        },

        newConversation() {
          if (this.isLoading) this.stop(true);
          this.messages = [];
          this.history = [];
          this.ledgers = [];
          this.hasSearched = false;
          this.newBelow = false;
          try { localStorage.removeItem(CONVO_KEY); } catch (e) { }
          window.scrollTo({ top: 0 });
          this.$nextTick(() => this.syncBar());
        },

        rememberRecent(q, led) {
          if (!q || !led || !(led.entries || []).length) return;
          const e = led.entries[0];
          const prices = [];
          (e.options || []).forEach(o => {
            const p = (o.price != null) ? o.price : o.total_price;
            if (typeof p === 'number') prices.push(p);
          });
          (e.cheapest_dates || []).forEach(d => { if (typeof d.price === 'number') prices.push(d.price); });
          const rec = { q, route: e.route || q, depart: e.depart || null,
                        saw: prices.length ? Math.min(...prices) : null, at: Date.now() };
          const dupe = q.trim().toLowerCase();
          this.recents = [rec, ...this.recents.filter(r => (r.q || '').trim().toLowerCase() !== dupe)].slice(0, 8);
          try { localStorage.setItem(RECENTS_KEY, JSON.stringify(this.recents)); } catch (e2) { }
        },

        clearRecents() {
          this.recents = [];
          try { localStorage.removeItem(RECENTS_KEY); } catch (e) { }
        },

        recentMeta(r) {
          return [
            r.depart ? this.formatDate(r.depart) : null,
            r.saw != null ? 'saw ' + this.formatPrice(r.saw, 'USD') : null,
            this.agoText(r.at),
          ].filter(Boolean).join(' · ');
        },

        agoText(ts) {
          if (!ts) return '';
          const m = Math.max(1, Math.round((Date.now() - ts) / 60000));
          if (m < 60) return m + 'm ago';
          const h = Math.round(m / 60);
          if (h < 24) return h + 'h ago';
          return Math.round(h / 24) + 'd ago';
        },

        dropStreamingMsg() {
          const last = this.messages[this.messages.length - 1];
          if (last && last.role === 'assistant' && last._streaming) this.messages.pop();
        },

        // ---- share: a boarding-pass PNG drawn on canvas with the page's own
        // fonts; the card stays cream in every theme, like the route maps ----
        shareFlight(f, sec) {
          const legs = f.legs || [];
          this.openShare({
            kind: 'one way',
            route: legs[0].from + ' → ' + legs[legs.length - 1].to,
            segs: [this._shareSeg('Flight', f)],
            price: this.formatPrice(f.price, f.currency),
            priceNote: this.partyN(sec) > 1
              ? 'one way, total for ' + this.partyN(sec) + ' travelers'
              : 'one way, per person',
            url: f.booking_url,
          });
        },
        sharePairing(it, sec) {
          if (!it) return;
          const o = it.outbound.legs;
          this.openShare({
            kind: 'round trip',
            route: o[0].from + ' → ' + o[o.length - 1].to,
            segs: [this._shareSeg('Out', it.outbound), this._shareSeg('Back', it.return)],
            price: this.formatPrice(it.total_price, it.currency),
            priceNote: this.partyN(sec) > 1
              ? 'round trip, total for ' + this.partyN(sec) + ' travelers'
              : 'round trip total, per person',
            url: it.booking_url,
          });
        },
        shareMulti(it, sec) {
          const parts = it.parts || [];
          const chain = parts.map(p => p.legs[0].from);
          chain.push(parts[parts.length - 1].legs[parts[parts.length - 1].legs.length - 1].to);
          this.openShare({
            kind: 'multi-city',
            route: chain.join(' → '),
            segs: parts.map((p, i) => this._shareSeg('Leg ' + (i + 1), p)),
            price: this.formatPrice(it.total_price, it.currency),
            priceNote: (this.partyN(sec) > 1 ? 'total for ' + this.partyN(sec) + ' travelers' : 'total, per person')
              + (it.price_basis === 'separate tickets' ? ', as separate tickets' : ''),
            url: this.mcPerLeg(it) ? null : it.booking_url,
            urls: this.mcPerLeg(it) ? parts.map(p => p.booking_url).filter(Boolean) : null,
          });
        },
        _shareSeg(tag, f) {
          const legs = f.legs || [];
          const a = legs[0], b = legs[legs.length - 1];
          const codes = legs.map(l => l.airline_code + ' ' + l.flight_number).slice(0, 2).join(' · ');
          return {
            tag,
            date: this.formatDate((a.departure || '').slice(0, 10)),
            times: this.formatTime(a.departure) + ' ' + a.from + '  →  ' + this.formatTime(b.arrival) + ' ' + b.to + this.arrivalDay(f),
            meta: f.airline + ' · ' + codes + (legs.length > 2 ? ' +' : '')
              + (f.duration ? ' · ' + this.formatDuration(f.duration) : '')
              + ' · ' + this.stopsText(f.stops) + this.viaShort(f),
          };
        },

        async openShare(trip) {
          this.share.open = true;
          this.share.toast = '';
          this.share.imgUrl = null;
          this.share.blob = null;
          this.share.text = this._shareText(trip);
          try {
            await document.fonts.ready;
            const canvas = this._drawTripCard(trip);
            const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
            this.share.blob = blob;
            this.share.imgUrl = URL.createObjectURL(blob);
            this.share.canNative = !!(navigator.canShare && blob
              && navigator.canShare({ files: [new File([blob], 'flight.png', { type: 'image/png' })] }));
          } catch (e) {
            this.share.canNative = false;
            this._toast('Could not render the card');
          }
        },
        closeShare() {
          this.share.open = false;
          if (this.share.imgUrl) { URL.revokeObjectURL(this.share.imgUrl); this.share.imgUrl = null; }
        },
        _shareText(t) {
          const lines = [t.route + ' · ' + t.kind];
          for (const s of t.segs) {
            lines.push((t.segs.length > 1 ? s.tag + ': ' : '') + s.date + ' · '
              + s.times.replace(/\s+/g, ' ') + ' · ' + s.meta);
          }
          lines.push(t.price + ' ' + t.priceNote);
          if (t.url && t.url !== '#') lines.push('Book: ' + t.url);
          (t.urls || []).forEach((u, i) => lines.push('Book leg ' + (i + 1) + ': ' + u));
          lines.push('found on flights.evanburkeen.com');
          return lines.join('\n');
        },

        async shareCopyImage() {
          try {
            await navigator.clipboard.write([
              new ClipboardItem({ 'image/png': Promise.resolve(this.share.blob) })]);
            this._toast('Image copied');
          } catch (e) {
            this.shareDownload();
            this._toast('Clipboard blocked, saved the image instead');
          }
        },
        async shareCopyText() {
          try { await navigator.clipboard.writeText(this.share.text); this._toast('Text copied'); }
          catch (e) { this._toast('Copy blocked by the browser'); }
        },
        shareDownload() {
          if (!this.share.imgUrl) return; // render failed; nothing to save
          const a = document.createElement('a');
          a.href = this.share.imgUrl;
          a.download = 'flight.png';
          a.click();
        },
        async shareNative() {
          try {
            await navigator.share({
              files: [new File([this.share.blob], 'flight.png', { type: 'image/png' })],
              text: this.share.text,
            });
          } catch (e) { /* user closed the sheet */ }
        },
        _toast(msg) {
          this.share.toast = msg;
          clearTimeout(this._toastTimer);
          this._toastTimer = setTimeout(() => { this.share.toast = ''; }, 2400);
        },

        _drawTripCard(t) {
          const S = 2, W = 1040, H = 148 + t.segs.length * 64 + 44;
          const c = document.createElement('canvas');
          c.width = W * S; c.height = H * S;
          const x = c.getContext('2d');
          x.scale(S, S);
          const ls = v => { try { x.letterSpacing = v; } catch (e) {} };
          x.fillStyle = '#f6f4f1'; x.fillRect(0, 0, W, H);          // ground
          const P = 16, R = 14, stubX = W - 280;
          x.save();                                                  // panel
          x.shadowColor = 'rgba(41,33,25,0.14)'; x.shadowBlur = 22; x.shadowOffsetY = 6;
          x.fillStyle = '#ffffff';
          this._rr(x, P, P, W - P * 2, H - P * 2, R); x.fill();
          x.restore();
          x.strokeStyle = '#e8e3dc'; x.lineWidth = 1;
          this._rr(x, P, P, W - P * 2, H - P * 2, R); x.stroke();
          x.setLineDash([4, 6]);                                     // perforation
          x.strokeStyle = '#d5cec4';
          x.beginPath(); x.moveTo(stubX, P + 12); x.lineTo(stubX, H - P - 12); x.stroke();
          x.setLineDash([]);
          for (const ny of [P, H - P]) {                             // notches
            x.fillStyle = '#f6f4f1';
            x.beginPath(); x.arc(stubX, ny, 9, 0, 7); x.fill();
            x.strokeStyle = '#e8e3dc';
            x.beginPath(); x.arc(stubX, ny, 9, 0, 7); x.stroke();
          }
          const L = P + 26, mainW = stubX - L - 22;
          ls('1.5px');                                               // header: trip type
          x.fillStyle = '#c4470f'; x.font = '600 12px Inter';
          x.fillText(t.kind.toUpperCase(), L, P + 34);
          ls('0px');
          x.fillStyle = '#1f1b17'; x.font = '700 38px Inter';
          const routeTxt = this._fit(x, t.route, mainW - 150);
          x.fillText(routeTxt, L, P + 78);
          const rw = x.measureText(routeTxt).width;                  // dotted flight arc
          if (L + mainW - (L + rw + 26) > 70) this._arc(x, L + rw + 26, L + mainW, P + 64);
          let y = P + 116;
          for (const s of t.segs) {
            ls('2px');
            x.fillStyle = '#8a837a'; x.font = '600 11px Inter';
            x.fillText(s.tag.toUpperCase(), L, y);
            ls('0px');
            x.fillStyle = '#1f1b17'; x.font = '600 19px Inter';
            x.fillText(this._fit(x, s.date + ' · ' + s.times, mainW), L, y + 23);
            x.fillStyle = '#57514a'; x.font = '400 13.5px Inter';
            x.fillText(this._fit(x, s.meta, mainW), L, y + 42);
            y += 64;
          }
          ls('2px');
          x.fillStyle = '#8a837a'; x.font = '600 10.5px Inter';
          x.fillText('FLIGHTS.EVANBURKEEN.COM', L, H - P - 15);
          ls('0px');
          const px = stubX + 24, sw = W - px - P - 12;               // stub
          ls('2px');
          x.fillStyle = '#8a837a'; x.font = '600 11px Inter';
          const d0 = (t.segs[0].date || '').replace(/^\w+, /, '');
          const d1 = (t.segs[t.segs.length - 1].date || '').replace(/^\w+, /, '');
          x.fillText((t.segs.length > 1 && d1 !== d0 ? d0 + ' – ' + d1 : d0).toUpperCase(), px, P + 34);
          ls('0px');
          x.fillStyle = '#1f1b17'; x.font = '700 36px Inter';
          x.fillText(this._fit(x, t.price, sw), px, P + 76);
          x.fillStyle = '#57514a'; x.font = '500 12.5px Inter';
          this._wrap(x, t.priceNote, px, P + 98, sw, 16);
          this._barcode(x, px, H - P - 46, sw - 10, 30, t.route + t.price);
          return c;
        },
        _arc(x, x0, x1, base) {
          // dotted great-circle motif: endpoint dots, a plane at the apex
          const mid = (x0 + x1) / 2, lift = 18;
          x.save();
          x.strokeStyle = 'rgba(196,71,15,0.5)'; x.lineWidth = 1.6;
          x.setLineDash([1, 5]);
          x.beginPath();
          x.moveTo(x0, base);
          x.quadraticCurveTo(mid, base - lift * 2, x1, base);
          x.stroke();
          x.setLineDash([]);
          x.fillStyle = '#c4470f';
          for (const dx of [x0, x1]) { x.beginPath(); x.arc(dx, base, 3.5, 0, 7); x.fill(); }
          x.restore();
        },
        _barcode(x, a, b, w, h, seed) {
          // deterministic from the trip, so the same flight shares the same code
          let n = 0;
          for (let i = 0; i < seed.length; i++) n = (n * 31 + seed.charCodeAt(i)) >>> 0;
          x.fillStyle = '#1f1b17';
          let cx = a;
          while (cx < a + w - 2) {
            n = (n * 1103515245 + 12345) >>> 0;
            const bw = 1 + (n % 3), gap = 1.5 + ((n >> 4) % 3);
            x.fillRect(cx, b, bw, h);
            cx += bw + gap;
          }
        },
        _rr(x, a, b, w, h, r) {
          x.beginPath();
          x.moveTo(a + r, b);
          x.arcTo(a + w, b, a + w, b + h, r);
          x.arcTo(a + w, b + h, a, b + h, r);
          x.arcTo(a, b + h, a, b, r);
          x.arcTo(a, b, a + w, b, r);
          x.closePath();
        },
        _fit(x, text, maxW) {
          let s = text || '';
          if (x.measureText(s).width <= maxW) return s;
          while (s.length > 1 && x.measureText(s + '…').width > maxW) s = s.slice(0, -1);
          return s + '…';
        },
        _wrap(x, text, a, b, maxW, lh) {
          let line = '', yy = b;
          for (const w of (text || '').split(' ')) {
            const test = line ? line + ' ' + w : w;
            if (x.measureText(test).width > maxW && line) { x.fillText(line, a, yy); line = w; yy += lh; }
            else line = test;
          }
          if (line) x.fillText(line, a, yy);
        },

        pickDate(d) {
          let q = `Show me the flights for ${d.date}`;
          if (d.return_date) q += `, returning ${d.return_date}`;
          this.search(q);
        },

        sectionLabel(sec) {
          // built server-side from the search itself; the message's first
          // line (the model's own summary) is only a fallback for old payloads
          if (sec.title) return sec.title;
          const msg = sec.message || '';
          return msg.split('\n')[0];
        },

        secIcon(sec) {
          const p = {
            flights: '<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>',
            itineraries: '<path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/>',
            dates: '<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
            multicity: '<circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/>',
          }[sec.type] || '<circle cx="12" cy="12" r="8"/>';
          return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>';
        },

        // Google's own airline marks (an unknown code returns its neutral
        // tail); the two-letter code sits underneath if an image cannot load
        logoUrl(code) {
          if (!code) return '';
          return 'https://www.gstatic.com/flights/airline_logos/70px/'
            + (this.theme === 'dark' ? 'dark/' : '') + encodeURIComponent(code) + '.png';
        },

        // prices are PARTY TOTALS for the searched travelers (server-verified);
        // these two drive every label that must stop saying "per person"
        partyN(sec) { return (sec && sec.party && sec.party.travelers) || 1; },
        paxSuffix(sec) { const n = this.partyN(sec); return n > 1 ? ' for ' + n + ' travelers' : ''; },

        visibleSections(msg) {
          // empty searches (transient hiccups the assistant retried) stay out
          // of the page; the reply text already tells that story. A section
          // with only from-priced outbounds (degraded round trip) DOES show:
          // every row is one tap from priced.
          return (msg.sections || []).filter(s =>
            (s.results || []).length || (s.dates || []).length || (s.more_outbounds || []).length
            // a degraded multi-city section may carry ONLY the Google
            // multi-city link — the prose says "the link is in this
            // section", so hiding the section broke that promise
            || (s.type === 'multicity' && s.combined_check_url)
            || this.mcHasLegs(s)
            // a search Google refused outright still shows, as its notice:
            // the cards may yet arrive (backfill)
            || ((s.backfill || {}).pieces || []).length > 0);
        },

        // ---- backfill. Nov 11, NYC to Hanoi: Google refused every JFK search
        // inside the turn (refusals come in bursts per request shape), so the
        // airport with the best options never appeared and the reply ranked a
        // partial list. The server ships what it could not get as `pieces`;
        // the page asks again AFTER the turn, when the burst has passed, and
        // /api/backfill merges and re-ranks by the turn's own rules. ----
        BF_DELAYS_MS: [5000, 20000, 45000],

        bfLabel(p) { return (p.origins || []).join('/') + '→' + (p.destinations || []).join('/'); },

        bfState(sec) {
          if (sec._bf && sec._bf.state === 'done') return sec.backfill_note ? 'done' : 'none';
          if (sec._bf && sec._bf.state) return sec._bf.state;
          if (((sec.backfill || {}).pieces || []).length) return 'idle';   // restored mid-way
          return sec.backfill_note ? 'done' : 'none';
        },

        bfText(sec) {
          const st = this.bfState(sec);
          const p = ((sec.backfill || {}).pieces || [])[0];
          const label = p ? this.bfLabel(p) : '';
          const prior = sec.backfill_note ? sec.backfill_note + ' ' : '';
          if (st === 'retrying') return prior + label + " hasn't loaded yet: Google turned it away during the search. "
            + 'Asking again; these cards update if it comes back.';
          if (st === 'failed') return prior + label + ' still has not loaded. Google keeps turning it away right now, '
            + 'so the list above is missing it.';
          if (st === 'idle') return prior + label + ' did not finish loading, so the list above is missing it.';
          return sec.backfill_note || '';
        },

        bfUrl(sec) { return (((sec.backfill || {}).pieces || [])[0] || {}).url || ''; },

        sectionAlive(sec) {
          return this.messages.some(m => (m.sections || []).includes(sec));
        },

        startBackfills(msg) {
          for (const sec of (msg && msg.sections) || []) {
            if (((sec.backfill || {}).pieces || []).length && sec.watch_spec && !sec._bf) this.runBackfill(sec);
          }
        },

        async runBackfill(sec, manual = false) {
          if ((sec._bf || {}).state === 'retrying' || !sec.watch_spec) return;
          sec._bf = { state: 'retrying' };
          while (((sec.backfill || {}).pieces || []).length) {
            const piece = sec.backfill.pieces[0];
            let out = null;
            // a tap means "now"; the automatic run waits out the burst first
            const delays = manual ? [300, ...this.BF_DELAYS_MS.slice(1)] : this.BF_DELAYS_MS;
            for (const wait of delays) {
              await new Promise(r => setTimeout(r, wait));
              if (!this.sectionAlive(sec)) return;           // New trip, or the turn was dropped
              try {
                const res = await fetch('/api/backfill', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ spec: sec.watch_spec, piece, rows: sec.results || [] }),
                });
                const d = await res.json();
                if (['ok', 'empty', 'invalid'].includes(d.status)) { out = d; break; }
              } catch (e) { /* a dropped socket is just another refusal: wait and ask again */ }
            }
            if (!this.sectionAlive(sec)) return;
            if (!out) { sec._bf = { state: 'failed' }; this.persistConvo(); return; }
            let note = '';
            if (out.status === 'ok') {
              sec.results = out.results || sec.results;
              if (out.price_context_stale) sec.price_context = null;   // it described the old cheapest fare
              this.updateLedger(out.ledger);
              note = out.note || '';
            } else if (out.status === 'empty') {
              note = 'Google answered for ' + this.bfLabel(piece) + ': no flights on this date.';
            }
            if (note) sec.backfill_note = ((sec.backfill_note || '') + ' ' + note).trim();
            sec.backfill = { pieces: sec.backfill.pieces.slice(1) };
            this.persistConvo();
          }
          sec._bf = { state: 'done' };
          this.persistConvo();
        },

        // the next turn's memory must describe the cards as they are NOW,
        // not as the reply left them, or it will say JFK never loaded
        updateLedger(entry) {
          if (!entry || !entry.route) return;
          for (let i = this.ledgers.length - 1; i >= 0; i--) {
            const es = this.ledgers[i].entries || [];
            const j = es.findIndex(e => e.route === entry.route && e.kind === entry.kind);
            if (j >= 0) { es[j] = { ...es[j], ...entry, search: es[j].search || entry.search }; return; }
          }
          // the turn recorded nothing for it (the section was empty)
          if (this.ledgers.length) (this.ledgers[this.ledgers.length - 1].entries ||= []).push(entry);
          else this.ledgers.push({ entries: [entry] });
        },

        ladder() {
          const items = [];
          for (const m of this.messages) {
            for (const sec of m.sections || []) {
              if (sec._anchor && ((sec.results || []).length || (sec.dates || []).length || (sec.more_outbounds || []).length
                  || (sec.type === 'multicity' && sec.combined_check_url) || this.mcHasLegs(sec)
                  || ((sec.backfill || {}).pieces || []).length)) {
                items.push({ anchor: sec._anchor, label: this.sectionLabel(sec) });
              }
            }
          }
          return items;
        },

        jumpTo(anchor) {
          document.getElementById(anchor)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        },

        renderText(t) {
          // the server strips the trailing SUGGESTIONS line, but belt and
          // braces: never render it if one slips through
          const esc = (t || '').replace(/\n*SUGGESTIONS:[\s\S]*$/, '')
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
